<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // INITIAL CONSTANTS & MASTER DATA
        // ==========================================
        const EMPLOYEES = [
            { id: 'emp_1', name: 'Rere', role: 'Admin', defaultShift: 'Admin' },
            { id: 'emp_2', name: 'Vanka', role: 'Admin', defaultShift: 'Admin' },
            { id: 'emp_3', name: 'Belina', role: 'Terapis', defaultShift: 'Terapis' },
            { id: 'emp_4', name: 'Lala', role: 'Terapis', defaultShift: 'Terapis' },
            { id: 'emp_5', name: 'Aura', role: 'Terapis', defaultShift: 'Terapis' },
            { id: 'emp_6', name: 'Erlita', role: 'Terapis', defaultShift: 'Terapis' },
            { id: 'emp_7', name: 'Ervina', role: 'Terapis', defaultShift: 'Terapis' },
            { id: 'emp_8', name: 'Jalitut', role: 'OB', defaultShift: 'OB' }
        ];

        // Forbidden Therapist Pairs on Same Shift
        const FORBIDDEN_PAIRS = [
            ['Belina', 'Aura'],
            ['Lala', 'Erlita']
        ];

        // Allowed Off Days (0: Sun, 3: Wed, 6: Sat)
        const ALLOWED_OFF_DAYS = [0, 3, 6]; 
        const DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        // Initial Special Calendar Data for Nov 2026
        const INITIAL_CALENDAR_EVENTS = {
            '2026-11-10': { title: 'Hari Pahlawan', type: 'Hari Libur Nasional', isOpen: true, note: 'Operasional normal klinik' },
            '2026-11-18': { title: 'Hari Kesehatan Nasional', type: 'Hari Operasional Khusus', isOpen: true, note: 'Layanan konsultasi spesialis' },
            '2026-11-25': { title: 'Maintenance & Sanitasi Klinik', type: 'Hari Klinik Tutup', isOpen: false, closurePolicy: 'NOT_COUNTED', note: 'Sterilisasi berkala fasilitas klinik' }
        };

        // Standard Accounts (Authentication)
        const ACCOUNTS = [
            { username: 'manager', name: 'Manager Klinik', role: 'manager', pass: '@Adeeva0506' },
            ...EMPLOYEES.map(emp => ({
                username: emp.name.toLowerCase(),
                name: emp.name,
                role: 'employee',
                pass: 'admin123',
                employeeId: emp.id
            }))
        ];

        const MONTH_NAMES = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

        // ==========================================
        // UTILITY FUNCTIONS & SCHEDULER ALGORITHM
        // ==========================================
        function getDaysInMonth(year, month) {
            const date = new Date(year, month - 1, 1);
            const days = [];
            while (date.getMonth() === month - 1) {
                const dayOfWeek = date.getDay();
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                days.push({
                    dateStr,
                    dayNum: date.getDate(),
                    dayOfWeek,
                    dayName: DAY_NAMES[dayOfWeek],
                    isAllowedOffDay: ALLOWED_OFF_DAYS.includes(dayOfWeek)
                });
                date.setDate(date.getDate() + 1);
            }
            return days;
        }

        // Automatic Constraint-Based Schedule Generator
        function generateAutoSchedule(year, month, calendarEvents) {
            const monthDays = getDaysInMonth(year, month);
            const schedule = {};
            
            // Track off-days count for each employee
            const offCounts = {};
            EMPLOYEES.forEach(emp => offCounts[emp.name] = 0);

            // Filter available off-day dates (Wed, Sat, Sun)
            const candidateOffDates = monthDays.filter(d => d.isAllowedOffDay && (calendarEvents[d.dateStr]?.isOpen !== false));

            // Distribute 2 off days per employee randomly among candidate off dates
            const employeeOffDates = {};
            EMPLOYEES.forEach(emp => {
                employeeOffDates[emp.name] = [];
            });

            // Smart Assignment for Off Days to ensure balanced distribution
            EMPLOYEES.forEach(emp => {
                // Pick 2 distinct days
                const shuffled = [...candidateOffDates].sort(() => 0.5 - Math.random());
                let assigned = 0;
                for (let d of shuffled) {
                    if (assigned >= 2) break;
                    // Avoid grouping too many off days on single date
                    const countOnDate = Object.values(employeeOffDates).filter(list => list.includes(d.dateStr)).length;
                    if (countOnDate < 3) {
                        employeeOffDates[emp.name].push(d.dateStr);
                        offCounts[emp.name]++;
                        assigned++;
                    }
                }
            });

            // Build Daily Roster
            monthDays.forEach(d => {
                const dateStr = d.dateStr;
                const isClosed = calendarEvents[dateStr] && !calendarEvents[dateStr].isOpen;

                const dailyRoster = {
                    dateStr,
                    dayName: d.dayName,
                    status: isClosed ? 'CLOSED' : 'OPEN',
                    note: calendarEvents[dateStr]?.title || '',
                    assignments: {}
                };

                if (isClosed) {
                    // Clinic is Closed
                    EMPLOYEES.forEach(emp => {
                        dailyRoster.assignments[emp.name] = 'KLINIK TUTUP';
                    });
                } else {
                    // 1. ADMIN RULES (Rere & Vanka)
                    const rereOff = employeeOffDates['Rere']?.includes(dateStr);
                    const vankaOff = employeeOffDates['Vanka']?.includes(dateStr);

                    if (rereOff && vankaOff) {
                        // Conflict fallback: Force Vanka to work
                        dailyRoster.assignments['Rere'] = 'Libur';
                        dailyRoster.assignments['Vanka'] = 'Full Shift';
                    } else if (rereOff) {
                        dailyRoster.assignments['Rere'] = 'Libur';
                        dailyRoster.assignments['Vanka'] = 'Full Shift';
                    } else if (vankaOff) {
                        dailyRoster.assignments['Vanka'] = 'Libur';
                        dailyRoster.assignments['Rere'] = 'Full Shift';
                    } else {
                        // Alternate Morning/Afternoon
                        if (d.dayNum % 2 === 0) {
                            dailyRoster.assignments['Rere'] = 'Pagi';
                            dailyRoster.assignments['Vanka'] = 'Siang';
                        } else {
                            dailyRoster.assignments['Rere'] = 'Siang';
                            dailyRoster.assignments['Vanka'] = 'Pagi';
                        }
                    }

                    // 2. THERAPIST RULES
                    const therapists = ['Belina', 'Lala', 'Aura', 'Erlita', 'Ervina'];
                    const workingTherapists = therapists.filter(t => !employeeOffDates[t]?.includes(dateStr));
                    
                    therapists.forEach(t => {
                        if (employeeOffDates[t]?.includes(dateStr)) {
                            dailyRoster.assignments[t] = 'Libur';
                        }
                    });

                    // Assign Morning / Afternoon considering pair constraints
                    // Pair 1: Belina & Aura | Pair 2: Lala & Erlita
                    // Strategy: Assign Belina -> Pagi, Aura -> Siang (or vice versa based on date)
                    let belinaShift = (d.dayNum % 2 === 1) ? 'Pagi' : 'Siang';
                    let auraShift = belinaShift === 'Pagi' ? 'Siang' : 'Pagi';

                    let lalaShift = (d.dayNum % 2 === 0) ? 'Pagi' : 'Siang';
                    let erlitaShift = lalaShift === 'Pagi' ? 'Siang' : 'Pagi';

                    let ervinaShift = (d.dayNum % 3 === 0) ? 'Pagi' : 'Siang';

                    if (!employeeOffDates['Belina']?.includes(dateStr)) dailyRoster.assignments['Belina'] = belinaShift;
                    if (!employeeOffDates['Aura']?.includes(dateStr)) dailyRoster.assignments['Aura'] = auraShift;
                    if (!employeeOffDates['Lala']?.includes(dateStr)) dailyRoster.assignments['Lala'] = lalaShift;
                    if (!employeeOffDates['Erlita']?.includes(dateStr)) dailyRoster.assignments['Erlita'] = erlitaShift;
                    if (!employeeOffDates['Ervina']?.includes(dateStr)) dailyRoster.assignments['Ervina'] = ervinaShift;

                    // 3. OB RULE (Jalitut)
                    if (employeeOffDates['Jalitut']?.includes(dateStr)) {
                        dailyRoster.assignments['Jalitut'] = 'Libur';
                    } else {
                        dailyRoster.assignments['Jalitut'] = 'OB';
                    }
                }

                schedule[dateStr] = dailyRoster;
            });

            return schedule;
        }

        // Rule Validation Engine
        function validateScheduleRules(schedule, year, month, calendarEvents) {
            const errors = [];
            const warnings = [];
            const monthDays = getDaysInMonth(year, month);

            // 1. Check Off Days count and Days of Week per Employee
            const employeeOffCounts = {};
            const invalidOffDayDates = [];

            EMPLOYEES.forEach(emp => {
                employeeOffCounts[emp.name] = 0;
            });

            monthDays.forEach(d => {
                const dateStr = d.dateStr;
                const roster = schedule[dateStr];
                if (!roster) return;

                const isClinicClosed = calendarEvents[dateStr] && !calendarEvents[dateStr].isOpen;

                EMPLOYEES.forEach(emp => {
                    const shift = roster.assignments[emp.name];
                    if (shift === 'Libur') {
                        employeeOffCounts[emp.name]++;
                        // Check day of week rule
                        if (!d.isAllowedOffDay && !isClinicClosed) {
                            errors.push(`Hari Libur terlarang: ${emp.name} libur pada ${d.dayName}, ${dateStr} (Libur hanya boleh Rabu, Sabtu, Minggu).`);
                        }
                    }
                });

                // 2. Admin Rules Check
                if (!isClinicClosed) {
                    const rereShift = roster.assignments['Rere'];
                    const vankaShift = roster.assignments['Vanka'];

                    if (rereShift === 'Libur' && vankaShift === 'Libur') {
                        errors.push(`Konflik Admin: Rere & Vanka libur bersamaan pada tanggal ${dateStr}.`);
                    }
                    if (rereShift === 'Libur' && vankaShift !== 'Full Shift') {
                        errors.push(`Konflik Shift Admin: Rere libur pada ${dateStr}, Vanka HARUS Full Shift (08.00–21.00).`);
                    }
                    if (vankaShift === 'Libur' && rereShift !== 'Full Shift') {
                        errors.push(`Konflik Shift Admin: Vanka libur pada ${dateStr}, Rere HARUS Full Shift (08.00–21.00).`);
                    }
                }

                // 3. Therapist Pair Rules Check
                if (!isClinicClosed) {
                    const belinaShift = roster.assignments['Belina'];
                    const auraShift = roster.assignments['Aura'];
                    if (belinaShift && auraShift && belinaShift !== 'Libur' && belinaShift === auraShift) {
                        errors.push(`Pelanggaran Terapis: Belina dan Aura berada pada shift yang sama (${belinaShift}) pada ${dateStr}.`);
                    }

                    const lalaShift = roster.assignments['Lala'];
                    const erlitaShift = roster.assignments['Erlita'];
                    if (lalaShift && erlitaShift && lalaShift !== 'Libur' && lalaShift === erlitaShift) {
                        errors.push(`Pelanggaran Terapis: Lala dan Erlita berada pada shift yang sama (${lalaShift}) pada ${dateStr}.`);
                    }
                }
            });

            // Off quota validation
            EMPLOYEES.forEach(emp => {
                if (employeeOffCounts[emp.name] !== 2) {
                    warnings.push(`Jatah Libur: ${emp.name} memiliki ${employeeOffCounts[emp.name]} hari libur (Ketentuan: Tepat 2 hari).`);
                }
            });

            return {
                status: errors.length > 0 ? 'TIDAK VALID' : warnings.length > 0 ? 'PERINGATAN' : 'VALID',
                errors,
                warnings,
                employeeOffCounts
            };
        }

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================
        function App() {
            // Auth State - null means not logged in (shows Login Screen FIRST)
            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ username: '', pass: '' });
            const [authError, setAuthError] = useState('');

            // App Navigation State
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'schedule', 'recap', 'calendar', 'audit'
            const [year, setYear] = useState(2026);
            const [month, setMonth] = useState(11); // 1-12

            // Calendar & Events
            const [calendarEvents, setCalendarEvents] = useState(INITIAL_CALENDAR_EVENTS);
            const [editingEvent, setEditingEvent] = useState(null);

            // Dynamic Schedules Store keyed by "YYYY-MM" (Runs effectively forever for any month/year)
            const [schedulesStore, setSchedulesStore] = useState(() => {
                const initialKey = '2026-11';
                return {
                    [initialKey]: {
                        schedule: generateAutoSchedule(2026, 11, INITIAL_CALENDAR_EVENTS),
                        isPublished: true,
                        lastPublishedAt: '2026-10-28 09:00'
                    }
                };
            });

            const currentMonthKey = `${year}-${String(month).padStart(2, '0')}`;

            // Helper to get active month's schedule state
            const currentScheduleData = useMemo(() => {
                if (!schedulesStore[currentMonthKey]) {
                    // Auto generate default schedule if switching to a new month/year
                    return {
                        schedule: generateAutoSchedule(year, month, calendarEvents),
                        isPublished: false,
                        lastPublishedAt: null
                    };
                }
                return schedulesStore[currentMonthKey];
            }, [schedulesStore, currentMonthKey, year, month, calendarEvents]);

            const schedule = currentScheduleData.schedule;
            const isPublished = currentScheduleData.isPublished;
            const lastPublishedAt = currentScheduleData.lastPublishedAt;

            // Audit Trail
            const [auditLogs, setAuditLogs] = useState([
                { timestamp: '2026-10-28 09:00', user: 'Manager Klinik', action: 'Terbit Jadwal', details: 'Jadwal November 2026 resmi diterbitkan.' }
            ]);

            // Date Row Edit Modal State (Manager Manual Off-Day & Shift Editor)
            const [editingDateRow, setEditingDateRow] = useState(null);

            // Toast Alert State
            const [toastMessage, setToastMessage] = useState(null);

            // Filters
            const [searchStaff, setSearchStaff] = useState('');
            const [filterShift, setFilterShift] = useState('ALL');

            // Quick Toast Handler
            const triggerToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Audit Logger
            const logAction = (action, details) => {
                const now = new Date();
                const timeStr = now.toISOString().replace('T', ' ').substring(0, 16);
                setAuditLogs(prev => [{
                    timestamp: timeStr,
                    user: currentUser ? currentUser.name : 'System',
                    action,
                    details
                }, ...prev]);
            };

            // Validation Evaluation
            const validationReport = useMemo(() => {
                return validateScheduleRules(schedule, year, month, calendarEvents);
            }, [schedule, year, month, calendarEvents]);

            // Role Access Guard
            const checkManagerAccess = (actionName) => {
                if (!currentUser || currentUser.role !== 'manager') {
                    triggerToast("Akses ditolak. Anda tidak memiliki izin untuk mengubah jadwal.", "error");
                    return false;
                }
                return true;
            };

            // Helper to update active month's schedule object safely
            const updateActiveSchedule = (newSchedule, newIsPublished, newPublishedAt) => {
                setSchedulesStore(prev => ({
                    ...prev,
                    [currentMonthKey]: {
                        schedule: newSchedule !== undefined ? newSchedule : (prev[currentMonthKey]?.schedule || schedule),
                        isPublished: newIsPublished !== undefined ? newIsPublished : (prev[currentMonthKey]?.isPublished ?? false),
                        lastPublishedAt: newPublishedAt !== undefined ? newPublishedAt : (prev[currentMonthKey]?.lastPublishedAt || null)
                    }
                }));
            };

            // Handle Manual Generator (Protected: cannot change published schedule)
            const handleGenerateSchedule = () => {
                if (!checkManagerAccess("Generate Schedule")) return;
                if (isPublished) {
                    triggerToast("Jadwal bulan ini telah DITERBITKAN & TERKUNCI. Tarik jadwal terlebih dahulu jika ingin meng-generate ulang!", "error");
                    return;
                }
                const newSched = generateAutoSchedule(year, month, calendarEvents);
                updateActiveSchedule(newSched, false, lastPublishedAt);
                logAction("Generate Schedule", `Generator otomatis membuat draft jadwal baru bulan ${MONTH_NAMES[month - 1]} ${year}`);
                triggerToast(`Jadwal otomatis ${MONTH_NAMES[month - 1]} ${year} berhasil digenerate! Silakan periksa validasi.`, "success");
            };

            // Handle Manual Shift Edit (Protected: cannot change published schedule)
            const handleCellEdit = (dateStr, empName, newShift) => {
                if (!checkManagerAccess("Edit Shift")) return;

                if (isPublished) {
                    triggerToast("🚫 JADWAL RESMI TERKUNCI! Jadwal yang sudah diterbitkan tidak boleh diubah secara langsung. Silakan tekan 'Tarik Jadwal' terlebih dahulu untuk melakukan revisi.", "error");
                    return;
                }

                const prevShift = schedule[dateStr]?.assignments[empName];
                const updatedSchedule = {
                    ...schedule,
                    [dateStr]: {
                        ...schedule[dateStr],
                        assignments: {
                            ...schedule[dateStr].assignments,
                            [empName]: newShift
                        }
                    }
                };

                updateActiveSchedule(updatedSchedule, false, lastPublishedAt);
                logAction("Edit Shift", `Mengubah ${empName} pada ${dateStr} dari '${prevShift}' menjadi '${newShift}'`);
                triggerToast(`Shift ${empName} pada ${dateStr} diperbarui.`, "info");
            };

            // Handle Publish
            const handlePublishSchedule = () => {
                if (!checkManagerAccess("Publish Schedule")) return;
                if (validationReport.status === 'TIDAK VALID') {
                    triggerToast("Gagal menerbitkan! Masih terdapat Pelanggaran Aturan Wajib pada jadwal.", "error");
                    return;
                }
                const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
                updateActiveSchedule(schedule, true, nowStr);
                logAction("Terbit Jadwal", `Jadwal resmi bulan ${MONTH_NAMES[month - 1]} ${year} telah dipublikasikan.`);
                triggerToast(`Jadwal resmi ${MONTH_NAMES[month - 1]} ${year} berhasil dipublikasikan untuk seluruh pegawai!`, "success");
            };

            // Handle Unpublish / Tarik Jadwal (Manager Only)
            const handleUnpublishSchedule = () => {
                if (!checkManagerAccess("Tarik Jadwal")) return;
                updateActiveSchedule(schedule, false, lastPublishedAt);
                logAction("Tarik Jadwal", `Manager menarik kembali publikasi jadwal resmi bulan ${MONTH_NAMES[month - 1]} ${year} menjadi status Draft/Revisi.`);
                triggerToast(`Jadwal resmi ${MONTH_NAMES[month - 1]} ${year} telah ditarik kembali! Status jadwal saat ini: Draft / Revisi.`, "info");
            };

            // Handle Auth Login
            const handleLoginSubmit = (e) => {
                if (e) e.preventDefault();
                const acc = ACCOUNTS.find(a => a.username.toLowerCase() === loginForm.username.toLowerCase() && a.pass === loginForm.pass);
                if (acc) {
                    setCurrentUser(acc);
                    setLoginForm({ username: '', pass: '' });
                    setAuthError('');
                    triggerToast(`Selamat datang, ${acc.name}! Anda masuk sebagai ${acc.role.toUpperCase()}.`, "success");
                } else {
                    setAuthError('Username atau kata sandi tidak valid.');
                }
            };

            // Quick Login Helper for smooth demo testing
            const handleQuickLogin = (username, pass) => {
                const acc = ACCOUNTS.find(a => a.username.toLowerCase() === username.toLowerCase() && a.pass === pass);
                if (acc) {
                    setCurrentUser(acc);
                    setLoginForm({ username: '', pass: '' });
                    setAuthError('');
                    triggerToast(`Selamat datang, ${acc.name}! (Role: ${acc.role.toUpperCase()})`, "success");
                }
            };

            // Handle Logout
            const handleLogout = () => {
                setCurrentUser(null);
                triggerToast("Anda telah keluar dari sistem.", "info");
            };

            // Calculate Analytics / Recap Data
            const recapData = useMemo(() => {
                const monthDays = getDaysInMonth(year, month);
                return EMPLOYEES.map(emp => {
                    let totalWorkDays = 0;
                    let totalOffDays = 0;
                    let pagiCount = 0;
                    let siangCount = 0;
                    let fullShiftCount = 0;
                    let obCount = 0;
                    let totalHours = 0;
                    let breakHours = 0;
                    const offDatesList = [];

                    monthDays.forEach(d => {
                        const shift = schedule[d.dateStr]?.assignments[emp.name];
                        if (shift === 'Libur') {
                            totalOffDays++;
                            offDatesList.push(`${d.dayName}, ${d.dayNum}`);
                        } else if (shift === 'Pagi') {
                            totalWorkDays++;
                            pagiCount++;
                            totalHours += 8;
                            breakHours += 1;
                        } else if (shift === 'Siang') {
                            totalWorkDays++;
                            siangCount++;
                            totalHours += 8;
                            breakHours += 1;
                        } else if (shift === 'Full Shift') {
                            totalWorkDays++;
                            fullShiftCount++;
                            totalHours += 13;
                            breakHours += 2;
                        } else if (shift === 'OB') {
                            totalWorkDays++;
                            obCount++;
                            totalHours += 8;
                            breakHours += 1;
                        }
                    });

                    return {
                        name: emp.name,
                        role: emp.role,
                        totalWorkDays,
                        totalOffDays,
                        pagiCount,
                        siangCount,
                        fullShiftCount,
                        obCount,
                        totalHours,
                        breakHours,
                        effectiveHours: totalHours - breakHours,
                        offDatesList
                    };
                });
            }, [schedule, year, month]);

            // Export to Excel Engine
            const exportToExcel = () => {
                const days = getDaysInMonth(year, month);
                const rows = days.map(d => {
                    const r = schedule[d.dateStr]?.assignments || {};
                    return {
                        'Tanggal': d.dateStr,
                        'Hari': d.dayName,
                        'Admin (Rere)': r['Rere'] || '-',
                        'Admin (Vanka)': r['Vanka'] || '-',
                        'Belina (Terapis)': r['Belina'] || '-',
                        'Lala (Terapis)': r['Lala'] || '-',
                        'Aura (Terapis)': r['Aura'] || '-',
                        'Erlita (Terapis)': r['Erlita'] || '-',
                        'Ervina (Terapis)': r['Ervina'] || '-',
                        'Jalitut (OB)': r['Jalitut'] || '-',
                        'Status Klinik': schedule[d.dateStr]?.status === 'CLOSED' ? 'KLINIK TUTUP' : 'BUKA',
                        'Catatan': schedule[d.dateStr]?.note || ''
                    };
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `Jadwal_${MONTH_NAMES[month-1]}_${year}`);
                XLSX.writeFile(wb, `Jadwal_AYOMI_Beaute_${month}_${year}.xlsx`);
                logAction("Ekspor Excel", `Mengunduh file Excel jadwal bulan ${MONTH_NAMES[month-1]} ${year}`);
            };

            // =========================================================
            // 1. MANDATORY INITIAL LOGIN SCREEN (If not logged in)
            // =========================================================
            if (!currentUser) {
                return (
                    <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                        {/* Background Decor */}
                        <div class="absolute -top-32 -left-32 w-96 h-96 bg-ayomi-600/30 rounded-full filter blur-3xl"></div>
                        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-rose-600/20 rounded-full filter blur-3xl"></div>

                        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 space-y-6 relative z-10 border border-slate-100">

                                                        <option value="Pagi">Shift Pagi (08.00–16.00)</option>
                                                        <option value="Siang">Shift Siang (13.00–21.00)</option>
                                                        <option value="Full Shift">Full Shift Admin (08.00–21.00)</option>
                                                        <option value="OB">Shift OB (07.00–15.00)</option>
                                                        <option value="Libur">🌴 LIBUR (Hari Libur Pegawai)</option>
                                                    </select>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div class="pt-3 border-t border-slate-200 flex justify-end">
                                    <button 
                                        onClick={() => setEditingDateRow(null)}
                                        class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow"
                                    >
                                        Selesai & Simpan Perubahan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // SUB-COMPONENTS
        // ==========================================
        function ShiftBadge({ name, shift, onEdit }) {
            const shiftStyles = {
                'Pagi': 'bg-blue-100 text-blue-800 border-blue-300',
                'Siang': 'bg-emerald-100 text-emerald-800 border-emerald-300',
                'Full Shift': 'bg-purple-100 text-purple-800 border-purple-300',
                'OB': 'bg-indigo-100 text-indigo-800 border-indigo-300',
                'Libur': 'bg-rose-100 text-rose-700 border-rose-300 font-bold'
            };

            const style = shiftStyles[shift] || 'bg-slate-100 text-slate-600 border-slate-200';

            return (
                <div class="inline-flex items-center space-x-1 group relative">
                    <span class={`px-2 py-0.5 rounded text-[11px] font-bold border ${style}`}>
                        {name} ({shift})
                    </span>

                    {onEdit && (
                        <select 
                            value={shift}
                            onChange={(e) => onEdit(e.target.value)}
                            class="opacity-0 group-hover:opacity-100 absolute inset-0 w-full h-full cursor-pointer bg-white text-[10px] font-bold border border-slate-400 rounded"
                        >
                            <option value="Pagi">Pagi</option>
                            <option value="Siang">Siang</option>
                            <option value="Full Shift">Full Shift</option>
                            <option value="Libur">Libur</option>
                        </select>
                    )}
                </div>
            );
        }

        // RENDER TO DOM
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
