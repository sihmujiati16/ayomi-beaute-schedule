                                                <option value="Admin">Admin Klinik</option>
                                                <option value="Terapis">Terapis Beauty</option>
                                                <option value="OB">Office Boy (OB)</option>
                                                <option value="Dokter">Dokter Spesialis</option>
                                                <option value="Kasir">Kasir</option>
                                            </select>
                                        </div>

                                        <div>
                                            <button 
                                                type="submit"
                                                class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-rose-200 flex items-center justify-center space-x-1"
                                            >
                                                <span>➕</span>
                                                <span>Tambah Pegawai</span>
                                            </button>
                                        </div>
                                    </form>

                                    {/* LIST TABLE PEGAWAI */}
                                    <div class="overflow-x-auto border border-rose-100 rounded-2xl shadow-sm">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-gradient-to-r from-slate-950 via-rose-950 to-purple-950 text-white font-bold uppercase tracking-wider">
                                                    <th class="p-3.5">ID</th>
                                                    <th class="p-3.5">Nama Pegawai</th>
                                                    <th class="p-3.5">Jabatan</th>
                                                    <th class="p-3.5">Username Login</th>
                                                    <th class="p-3.5">Password Initial</th>
                                                    <th class="p-3.5 text-center">Aksi / Hapus</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-rose-50 font-medium">
                                                {employees.map(emp => (
                                                    <tr key={emp.id} class="hover:bg-rose-50/50">
                                                        <td class="p-3.5 font-mono text-slate-400 text-[11px]">{emp.id}</td>
                                                        <td class="p-3.5 font-bold text-slate-800 text-sm">{emp.name}</td>
                                                        <td class="p-3.5">
                                                            <span class={`px-3 py-1 rounded-full font-black text-[10px] ${
                                                                emp.role === 'Admin' ? 'bg-purple-100 text-purple-800 border border-purple-200' :
                                                                emp.role === 'Terapis' ? 'bg-pink-100 text-pink-800 border border-pink-200' :
                                                                emp.role === 'OB' ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-blue-100 text-blue-800 border border-blue-200'
                                                            }`}>
                                                                {emp.role}
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5 font-mono text-slate-600">{emp.name.toLowerCase()}</td>
                                                        <td class="p-3.5 font-mono text-slate-400">admin123</td>
                                                        <td class="p-3.5 text-center">
                                                            <button 
                                                                onClick={() => setDeletingEmpId(emp.id)}
                                                                class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold px-3 py-1 rounded-xl text-xs transition"
                                                            >
                                                                🗑️ Hapus
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 4: RECAP & WORKING HOURS                             */}
                        {/* ========================================================= */}
                        {activeTab === 'recap' && (
                            <div class="space-y-6">
                                <div class="bg-white p-6 rounded-3xl border border-rose-100 shadow-md">
                                    <h3 class="font-extrabold text-slate-900 text-lg mb-2">
                                        📊 Rekapitulasi Jam Kerja & Jatah Libur ({MONTH_NAMES[month-1]} {year})
                                    </h3>
                                    <p class="text-xs text-slate-500 mb-4">
                                        Keterangan: Jam Efektif dihitung dari Total Jam Terjadwal dikurangi Durasi Istirahat Resmi (1 Jam per shift 8h, 2 Jam per Full Shift).
                                    </p>

                                    <div class="overflow-x-auto rounded-2xl border border-rose-100 shadow-sm">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-gradient-to-r from-slate-950 via-rose-950 to-purple-950 text-white font-bold uppercase tracking-wider">
                                                    <th class="p-3.5">Nama Pegawai</th>
                                                    <th class="p-3.5">Jabatan</th>
                                                    <th class="p-3.5">Hari Kerja</th>
                                                    <th class="p-3.5">Hari Libur</th>
                                                    <th class="p-3.5">Shift Pagi</th>
                                                    <th class="p-3.5">Shift Siang</th>
                                                    <th class="p-3.5">Full Shift</th>
                                                    <th class="p-3.5">Jam Terjadwal</th>
                                                    <th class="p-3.5">Jam Istirahat</th>
                                                    <th class="p-3.5">Jam Efektif</th>
                                                    <th class="p-3.5">Tanggal Libur Pegawai</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-rose-50 font-medium">
                                                {recapData.map(r => (
                                                    <tr key={r.name} class="hover:bg-rose-50/50">
                                                        <td class="p-3.5 font-bold text-slate-800">{r.name}</td>
                                                        <td class="p-3.5">
                                                            <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-bold text-[11px]">
                                                                {r.role}
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5 font-semibold text-emerald-700">{r.totalWorkDays} Hari</td>
                                                        <td class="p-3.5">
                                                            <span class={`font-bold px-2.5 py-1 rounded-lg ${r.totalOffDays === 2 ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'}`}>
                                                                {r.totalOffDays} Hari
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5">{r.pagiCount}</td>
                                                        <td class="p-3.5">{r.siangCount}</td>
                                                        <td class="p-3.5">{r.fullShiftCount}</td>
                                                        <td class="p-3.5 font-bold text-slate-800">{r.totalHours} Jam</td>
                                                        <td class="p-3.5 text-slate-500">{r.breakHours} Jam</td>
                                                        <td class="p-3.5 font-black text-rose-700">{r.effectiveHours} Jam</td>
                                                        <td class="p-3.5 text-[11px] text-slate-600">
                                                            {r.offDatesList.join(' | ')}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 5: CALENDAR & HOLIDAYS (MANAGER ONLY)                */}
                        {/* ========================================================= */}
                        {activeTab === 'calendar' && currentUser.role === 'manager' && (
                            <div class="space-y-6">
                                <div class="bg-white p-6 rounded-3xl border border-rose-100 shadow-md">
                                    <h3 class="font-bold text-slate-800 text-lg mb-2">
                                        ⚙️ Pengaturan Kalender, Hari Besar & Closure Policy
                                    </h3>
                                    <p class="text-xs text-slate-500 mb-4">
                                        Manager dapat mengatur tanggal khusus, hari besar keagamaan/nasional, serta menetapkan apakah klinik TUTUP atau BUKA.
                                    </p>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Event Form */}
                                        <div class="bg-gradient-to-r from-rose-50/50 to-pink-50/40 p-5 rounded-2xl border border-rose-200 space-y-3">
                                            <h4 class="font-bold text-slate-700 text-sm">Tambah / Edit Tanggal Khusus</h4>
                                            
                                            <div>
                                                <label class="text-xs font-semibold text-slate-600 block mb-1">Tanggal Khusus</label>
                                                <input 
                                                    type="date"
                                                    value={editingEvent?.dateStr || `${year}-${String(month).padStart(2,'0')}-15`}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, dateStr: e.target.value }))}
                                                    class="w-full border border-slate-300 rounded-xl p-2.5 text-xs bg-white font-medium"
                                                />
                                            </div>

                                            <div>
                                                <label class="text-xs font-semibold text-slate-600 block mb-1">Nama Hari Besar / Keterangan</label>
                                                <input 
                                                    type="text"
                                                    placeholder="Contoh: Maintenance Alat / Hari Besar Islam"
                                                    value={editingEvent?.title || ''}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, title: e.target.value }))}
                                                    class="w-full border border-slate-300 rounded-xl p-2.5 text-xs bg-white font-medium"
                                                />
                                            </div>

                                            <div>
                                                <label class="text-xs font-semibold text-slate-600 block mb-1">Kategori Hari Besar</label>
                                                <select 
                                                    value={editingEvent?.type || 'Hari Libur Nasional'}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, type: e.target.value }))}
                                                    class="w-full border border-slate-300 rounded-xl p-2.5 text-xs bg-white font-bold"
                                                >
                                                    <option value="Hari Besar Keagamaan Islam">Hari Besar Keagamaan Islam</option>
                                                    <option value="Hari Besar Keagamaan Kristen">Hari Besar Keagamaan Kristen</option>
                                                    <option value="Hari Libur Nasional">Hari Libur Nasional</option>
                                                    <option value="Hari Operasional Khusus">Hari Operasional Khusus</option>
                                                    <option value="Hari Klinik Tutup">Hari Klinik Tutup</option>
                                                </select>
                                            </div>

                                            <div class="flex items-center space-x-3 py-2">
                                                <label class="text-xs font-semibold text-slate-600">Status Operasional Klinik:</label>
                                                <button
                                                    type="button"
                                                    onClick={() => setEditingEvent(prev => ({ ...prev, isOpen: !prev?.isOpen }))}
                                                    class={`px-3.5 py-1.5 rounded-xl text-xs font-bold shadow ${
                                                        editingEvent?.isOpen !== false ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
                                                    }`}
                                                >
                                                    {editingEvent?.isOpen !== false ? 'KLINIK BUKA' : 'KLINIK TUTUP'}
                                                </button>
                                            </div>

                                            <button 
                                                onClick={() => {
                                                    if (!editingEvent?.dateStr || !editingEvent?.title) {
                                                        triggerToast("Lengkapi tanggal dan nama hari besar.", "error");
                                                        return;
                                                    }
                                                    setCalendarEvents(prev => ({
                                                        ...prev,
                                                        [editingEvent.dateStr]: {
                                                            title: editingEvent.title,
                                                            type: editingEvent.type,
                                                            isOpen: editingEvent.isOpen !== false,
                                                            closurePolicy: editingEvent.closurePolicy || 'COUNT_AS_OFF',
                                                            note: editingEvent.title
                                                        }
                                                    }));
                                                    logAction("Update Kalender", `Mengatur tanggal ${editingEvent.dateStr} sebagai ${editingEvent.title}`);
                                                    triggerToast("Kalender hari besar berhasil diperbarui!", "success");
                                                    setEditingEvent(null);
                                                }}
                                                class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-rose-200"
                                            >
                                                Simpan Tanggal Khusus
                                            </button>
                                        </div>

                                        {/* Event List */}
                                        <div class="space-y-3">
                                            <h4 class="font-bold text-slate-700 text-sm">Daftar Tanggal Khusus Terdaftar</h4>
                                            
                                            <div class="space-y-2">
                                                {Object.keys(calendarEvents).map(dateKey => {
                                                    const ev = calendarEvents[dateKey];
                                                    return (
                                                        <div key={dateKey} class="p-3.5 bg-white border border-rose-100 rounded-2xl flex items-center justify-between shadow-sm">
                                                            <div>
                                                                <div class="font-bold text-sm text-slate-800">{dateKey} — {ev.title}</div>
                                                                <div class="text-xs text-slate-500">{ev.type}</div>
                                                            </div>
                                                            <div class="flex items-center space-x-2">
                                                                <span class={`text-[10px] px-2.5 py-1 rounded-lg font-bold ${ev.isOpen ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'}`}>
                                                                    {ev.isOpen ? 'BUKA' : 'TUTUP'}
                                                                </span>
                                                                <button 
                                                                    onClick={() => {
                                                                        const copy = { ...calendarEvents };
                                                                        delete copy[dateKey];
                                                                        setCalendarEvents(copy);
                                                                        logAction("Hapus Tanggal", `Hapus tanggal khusus ${dateKey}`);
                                                                    }}
                                                                    class="text-xs text-rose-600 hover:text-rose-800 font-bold px-2 py-1"
                                                                >
                                                                    Hapus
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 6: AUDIT TRAIL LOGS (MANAGER ONLY)                   */}
                        {/* ========================================================= */}
                        {activeTab === 'audit' && currentUser.role === 'manager' && (
                            <div class="bg-white p-6 rounded-3xl border border-rose-100 shadow-md space-y-4">
                                <h3 class="font-extrabold text-slate-900 text-lg mb-2">
                                    📜 Riwayat Perubahan & Audit Trail System
                                </h3>
                                <p class="text-xs text-slate-500 mb-4">
                                    Mencatat seluruh aksi pengubahan jadwal, kalender, dan publikasi oleh pengguna.
                                </p>

                                <div class="overflow-x-auto rounded-2xl border border-rose-100 shadow-sm">
                                    <table class="w-full text-left text-xs border-collapse">
                                        <thead>
                                            <tr class="bg-gradient-to-r from-slate-950 via-rose-950 to-purple-950 text-white font-bold uppercase tracking-wider">
                                                <th class="p-3.5">Waktu (Timestamp)</th>
                                                <th class="p-3.5">Pengguna</th>
                                                <th class="p-3.5">Jenis Aksi</th>
                                                <th class="p-3.5">Detail Perubahan</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-rose-50">
                                            {auditLogs.map((log, index) => (
                                                <tr key={index} class="hover:bg-rose-50/50">
                                                    <td class="p-3.5 font-mono text-slate-600">{log.timestamp}</td>
                                                    <td class="p-3.5 font-semibold text-slate-800">{log.user}</td>
                                                    <td class="p-3.5">
                                                        <span class="bg-blue-100 text-blue-800 border border-blue-200 font-bold px-2.5 py-1 rounded-lg text-[10px]">
                                                            {log.action}
                                                        </span>
                                                    </td>
                                                    <td class="p-3.5 text-slate-700">{log.details}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* CONFIRMATION DELETE EMPLOYEE MODAL */}
                    {deletingEmpId && (
                        <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 text-center border border-rose-100">
                                <div class="text-3xl">⚠️</div>
                                <h3 class="text-base font-extrabold text-slate-900">
                                    Hapus Pegawai Ini?
                                </h3>
                                <p class="text-xs text-slate-600">
                                    Apakah Anda yakin ingin menghapus <strong>{employees.find(e => e.id === deletingEmpId)?.name}</strong>? Tindakan ini akan menghapus akun login dan memperbarui daftar roster.
                                </p>
                                <div class="flex items-center space-x-2 pt-2">
                                    <button 
                                        onClick={() => setDeletingEmpId(null)}
                                        class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => handleDeleteEmployee(deletingEmpId)}
                                        class="w-1/2 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-rose-200"
                                    >
                                        Ya, Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MANAGER MANUAL OFF-DAY & SHIFT EDITOR MODAL FOR SPECIFIC DATE */}
                    {editingDateRow && (
                        <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-6 space-y-5 border border-rose-100">
                                <div class="flex items-center justify-between border-b pb-3 border-rose-100">
                                    <div>
                                        <h3 class="text-lg font-extrabold text-slate-900">
                                            ✏️ Edit Penentuan Shift & Hari Libur Manual
                                        </h3>
                                        <p class="text-xs text-slate-500">
                                            Tanggal: <strong class="text-rose-700">{editingDateRow}</strong>
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setEditingDateRow(null)}
                                        class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                                    {employees.map(emp => {
                                        const currentShift = schedule[editingDateRow]?.assignments[emp.name] || 'Pagi';
                                        return (
                                            <div key={emp.name} class="p-3.5 bg-rose-50/40 border border-rose-100 rounded-2xl flex items-center justify-between">
                                                <div>
                                                    <div class="font-bold text-sm text-slate-800">{emp.name}</div>
                                                    <div class="text-xs text-slate-500">{emp.role}</div>
                                                </div>

                                                <div class="flex items-center space-x-2">
                                                    <select
                                                        value={currentShift}
                                                        onChange={(e) => handleCellEdit(editingDateRow, emp.name, e.target.value)}
                                                        class={`px-3 py-1.5 rounded-xl text-xs font-bold border shadow-sm ${
                                                            currentShift === 'Libur' ? 'bg-rose-100 text-rose-800 border-rose-300' :
                                                            currentShift === 'Pagi' ? 'bg-blue-100 text-blue-800 border-blue-300' :
                                                            currentShift === 'Siang' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                                                            currentShift === 'Full Shift' ? 'bg-purple-100 text-purple-800 border-purple-300' :
                                                            'bg-indigo-100 text-indigo-800 border-indigo-300'
                                                        }`}
                                                    >
                                                        <option value="Pagi">Shift Pagi (08.00–16.00)</option>
                                                        <option value="Siang">Shift Siang (13.00–21.00)</option>
                                                        <option value="Full Shift">Full Shift Admin (08.00–21.00)</option>
                                                        <option value="OB">Shift OB (07.00–15.00)</option>
                                                        <option value="Libur">🌴 LIBUR (Hari Libur Pegawai)</option>
                                                    </select>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div class="pt-3 border-t border-rose-100 flex justify-end">
                                    <button 
                                        onClick={() => setEditingDateRow(null)}
                                        class="bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition shadow-md shadow-rose-200"
                                    >
                                        Selesai & Simpan Perubahan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // VIBRANT SHIFT BADGE SUB-COMPONENT
        // ==========================================
        function ShiftBadge({ name, shift, onEdit }) {
            const shiftStyles = {
                'Pagi': 'bg-gradient-to-r from-rosegold-400 to-rosegold-500 text-white shadow-sm font-bold border border-champagne-200/40',
                'Siang': 'bg-gradient-to-r from-mulberry-700 to-mulberry-800 text-champagne-100 shadow-sm font-bold border border-champagne-400/30',
                'Full Shift': 'bg-gradient-to-r from-champagne-500 via-rosegold-500 to-mulberry-700 text-white shadow-sm font-extrabold border border-champagne-300',
                'OB': 'bg-gradient-to-r from-champagne-400 to-rosegold-400 text-mulberry-950 shadow-sm font-bold border border-champagne-300',
                'Libur': 'bg-blush-100 text-mulberry-900 border border-rosegold-300 font-extrabold'
            };

            const style = shiftStyles[shift] || 'bg-cream-100 text-mulberry-900 border border-champagne-300';

            return (
                <div class="inline-flex items-center space-x-1 group relative my-0.5">
                    <span class={`px-2.5 py-1 rounded-lg text-[11px] ${style}`}>
                        {name} ({shift})
                    </span>

                    {onEdit && (
                        <select 
                            value={shift}
                            onChange={(e) => onEdit(e.target.value)}
                            class="opacity-0 group-hover:opacity-100 absolute inset-0 w-full h-full cursor-pointer bg-white text-[10px] font-bold border border-slate-400 rounded-lg shadow"
                        >
                            <option value="Pagi">Pagi</option>
                            <option value="Siang">Siang</option>
                            <option value="Full Shift">Full Shift</option>
                            <option value="Libur">Libur</option>
                        </select>
                    )}
                </div>
            );
        }

        // RENDER TO DOM
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
