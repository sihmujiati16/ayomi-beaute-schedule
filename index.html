        // ==========================================
        // HAVERSINE DISTANCE HELPER
        // ==========================================
        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radius bumi dalam meter
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // ==========================================
        // UTILITY FUNCTIONS & SCHEDULER ALGORITHM
        // ==========================================
        function getDaysInMonth(year, month) {
            const date = new Date(year, month - 1, 1);
            const days = [];
            while (date.getMonth() === month - 1) {
                const dayOfWeek = date.getDay();
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                days.push({
                    dateStr,
                    dayNum: date.getDate(),
                    dayOfWeek,
                    dayName: DAY_NAMES[dayOfWeek],
                    isAllowedOffDay: ALLOWED_OFF_DAYS.includes(dayOfWeek)
                });
                date.setDate(date.getDate() + 1);
            }
            return days;
        }

        function generateAutoSchedule(year, month, calendarEvents, employeeList) {
            const monthDays = getDaysInMonth(year, month);
            const schedule = {};
            const activeEmployees = employeeList && employeeList.length > 0 ? employeeList : INITIAL_EMPLOYEES;
            
            const candidateOffDates = monthDays.filter(d => d.isAllowedOffDay && (calendarEvents[d.dateStr]?.isOpen !== false));

            const employeeOffDates = {};
            activeEmployees.forEach(emp => {
                employeeOffDates[emp.name] = [];
            });

            activeEmployees.forEach(emp => {
                const shuffled = [...candidateOffDates].sort(() => 0.5 - Math.random());
                let assigned = 0;
                for (let d of shuffled) {
                    if (assigned >= 2) break;
                    const offListOnDate = Object.keys(employeeOffDates).filter(name => employeeOffDates[name].includes(d.dateStr));
                    if (offListOnDate.length >= 2) continue;

                    const sameRoleOff = offListOnDate.some(offName => {
                        const existingEmp = activeEmployees.find(e => e.name === offName);
                        return existingEmp && existingEmp.role === emp.role;
                    });

                    if (!sameRoleOff) {
                        employeeOffDates[emp.name].push(d.dateStr);
                        assigned++;
                    }
                }
            });

            monthDays.forEach(d => {
                const dateStr = d.dateStr;
                const isClosed = calendarEvents[dateStr] && !calendarEvents[dateStr].isOpen;

                const dailyRoster = {
                    dateStr,
                    dayName: d.dayName,
                    status: isClosed ? 'CLOSED' : 'OPEN',
                    note: calendarEvents[dateStr]?.title || '',
                    assignments: {}
                };

                if (isClosed) {
                    activeEmployees.forEach(emp => {
                        dailyRoster.assignments[emp.name] = 'KLINIK TUTUP';
                    });
                } else {
                    const admins = activeEmployees.filter(e => e.role === 'Admin').map(e => e.name);
                    const rereOff = employeeOffDates['Rere']?.includes(dateStr);
                    const vankaOff = employeeOffDates['Vanka']?.includes(dateStr);

                    if (admins.includes('Rere') && admins.includes('Vanka')) {
                        if (rereOff) {
                            dailyRoster.assignments['Rere'] = 'Libur';
                            dailyRoster.assignments['Vanka'] = 'Full Shift';
                        } else if (vankaOff) {
                            dailyRoster.assignments['Vanka'] = 'Libur';
                            dailyRoster.assignments['Rere'] = 'Full Shift';
                        } else {
                            const isVankaFixedPagiDay = [1, 2, 4, 5].includes(d.dayOfWeek);
                            if (isVankaFixedPagiDay) {
                                dailyRoster.assignments['Vanka'] = 'Pagi';
                                dailyRoster.assignments['Rere'] = 'Siang';
                            } else {
                                if (d.dayNum % 2 === 0) {
                                    dailyRoster.assignments['Rere'] = 'Pagi';
                                    dailyRoster.assignments['Vanka'] = 'Siang';
                                } else {
                                    dailyRoster.assignments['Rere'] = 'Siang';
                                    dailyRoster.assignments['Vanka'] = 'Pagi';
                                }
                            }
                        }
                    } else {
                        admins.forEach((admName, idx) => {
                            if (employeeOffDates[admName]?.includes(dateStr)) {
                                dailyRoster.assignments[admName] = 'Libur';
                            } else {
                                dailyRoster.assignments[admName] = idx % 2 === 0 ? 'Pagi' : 'Siang';
                            }
                        });
                    }

                    const therapists = activeEmployees.filter(e => e.role === 'Terapis').map(e => e.name);
                    therapists.forEach(t => {
                        if (employeeOffDates[t]?.includes(dateStr)) {
                            dailyRoster.assignments[t] = 'Libur';
                        }
                    });

                    therapists.forEach((tName, idx) => {
                        if (!dailyRoster.assignments[tName]) {
                            if (tName === 'Belina') dailyRoster.assignments[tName] = d.dayNum % 2 === 1 ? 'Siang' : 'Pagi';
                            else if (tName === 'Aura') dailyRoster.assignments[tName] = d.dayNum % 2 === 1 ? 'Pagi' : 'Siang';
                            else if (tName === 'Lala') dailyRoster.assignments[tName] = d.dayNum % 2 === 0 ? 'Siang' : 'Pagi';
                            else if (tName === 'Erlita') dailyRoster.assignments[tName] = d.dayNum % 2 === 0 ? 'Pagi' : 'Siang';
                            else if (tName === 'Ervina') dailyRoster.assignments[tName] = 'Siang';
                            else dailyRoster.assignments[tName] = idx % 2 === 0 ? 'Pagi' : 'Siang';
                        }
                    });

                    const otherEmployees = activeEmployees.filter(e => !['Admin', 'Terapis'].includes(e.role));
                    otherEmployees.forEach(emp => {
                        if (employeeOffDates[emp.name]?.includes(dateStr)) {
                            dailyRoster.assignments[emp.name] = 'Libur';
                        } else {
                            dailyRoster.assignments[emp.name] = emp.role === 'OB' ? 'OB' : 'Pagi';
                        }
                    });
                }

                schedule[dateStr] = dailyRoster;
            });

            return schedule;
        }

        // ==========================================

        function App() {
            // SUPABASE CONFIGURATION STATE
            const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('ayomi_sb_url') || '');
            const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('ayomi_sb_key') || '');
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [connectionStatus, setConnectionStatus] = useState('LOCAL'); // LOCAL, CONNECTED, CONNECTING, ERROR

            // Initialize Supabase Client
            useEffect(() => {
                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        setConnectionStatus('CONNECTING');
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                        setConnectionStatus('CONNECTED');
                    } catch (e) {
                        console.error('Supabase init error:', e);
                        setConnectionStatus('ERROR');
                    }
                } else {
                    setConnectionStatus('LOCAL');
                }
            }, [supabaseUrl, supabaseKey]);

            // REALTIME BROADCAST CHANNEL (Fallback for multi-tab sync without Supabase)
            const syncChannelRef = useRef(null);
            useEffect(() => {
                if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
                    syncChannelRef.current = new BroadcastChannel('ayomi_beaute_sync_channel');
                }
                return () => {
                    if (syncChannelRef.current) syncChannelRef.current.close();
                };
            }, []);

            const broadcastSync = useCallback((actionType, payload) => {
                if (syncChannelRef.current) {
                    syncChannelRef.current.postMessage({ actionType, payload, timestamp: Date.now() });
                }
            }, []);

            // Dynamic Employees List
            const [employees, setEmployees] = useState(() => {
                const saved = localStorage.getItem('ayomi_employees');
                return saved ? JSON.parse(saved) : INITIAL_EMPLOYEES;
            });

            useEffect(() => {
                localStorage.setItem('ayomi_employees', JSON.stringify(employees));
            }, [employees]);

            const accounts = useMemo(() => [
                { username: 'manager', name: 'Manager Klinik', role: 'manager', pass: '@Adeeva0506' },
                ...employees.map(emp => ({
                    username: emp.name.toLowerCase().trim(),
                    name: emp.name,
                    role: 'employee',
                    pass: 'admin123',
                    employeeId: emp.id
                }))
            ], [employees]);

            const [currentUser, setCurrentUser] = useState(null);
            const [loginForm, setLoginForm] = useState({ username: '', pass: '' });
            const [authError, setAuthError] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [year, setYear] = useState(2026);
            const [month, setMonth] = useState(11);
            const [scheduleSubTab, setScheduleSubTab] = useState('personal');
            const [scheduleFilterShift, setScheduleFilterShift] = useState('ALL');

            // Attendance Logs Database State
            const [attendanceLogs, setAttendanceLogs] = useState(() => {
                const saved = localStorage.getItem('ayomi_attendance_logs');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('ayomi_attendance_logs', JSON.stringify(attendanceLogs));
            }, [attendanceLogs]);

            // Real-time Supabase Table Subscription for Attendance
            useEffect(() => {
                if (!supabaseClient) return;

                const fetchInitialAttendance = async () => {
                    const { data, error } = await supabaseClient.from('attendance').select('*').order('created_at', { ascending: false });
                    if (!error && data) {
                        setAttendanceLogs(data);
                    }
                };

                fetchInitialAttendance();

                const channel = supabaseClient
                    .channel('public:attendance')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            setAttendanceLogs(prev => [payload.new, ...prev]);
                            triggerToast(`⚡ Absensi Masuk/Pulang Baru dari ${payload.new.employee_name}!`, 'info');
                        } else if (payload.eventType === 'UPDATE') {
                            setAttendanceLogs(prev => prev.map(item => item.id === payload.new.id ? payload.new : item));
                        }
                    })
                    .subscribe();

                return () => {
                    supabaseClient.removeChannel(channel);
                };
            }, [supabaseClient]);

            // Calendar & Announcements
            const [calendarEvents, setCalendarEvents] = useState(() => {
                const saved = localStorage.getItem('ayomi_calendar_events');
                return saved ? JSON.parse(saved) : INITIAL_CALENDAR_EVENTS;
            });

            const [announcements, setAnnouncements] = useState(() => {
                const saved = localStorage.getItem('ayomi_announcements');
                return saved ? JSON.parse(saved) : INITIAL_ANNOUNCEMENTS;
            });

            // Schedule Store
            const [schedulesStore, setSchedulesStore] = useState(() => {
                const saved = localStorage.getItem('ayomi_schedules_store');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                const initialKey = '2026-11';
                return {
                    [initialKey]: {
                        schedule: generateAutoSchedule(2026, 11, INITIAL_CALENDAR_EVENTS, INITIAL_EMPLOYEES),
                        isPublished: true,
                        lastPublishedAt: '2026-10-28 09:00'
                    }
                };
            });

            useEffect(() => {
                localStorage.setItem('ayomi_schedules_store', JSON.stringify(schedulesStore));
            }, [schedulesStore]);

            const currentMonthKey = `${year}-${String(month).padStart(2, '0')}`;
            const currentScheduleData = useMemo(() => {
                if (!schedulesStore[currentMonthKey]) {
                    return {
                        schedule: generateAutoSchedule(year, month, calendarEvents, employees),
                        isPublished: false,
                        lastPublishedAt: null
                    };
                }
                return schedulesStore[currentMonthKey];
            }, [schedulesStore, currentMonthKey, year, month, calendarEvents, employees]);

            const schedule = currentScheduleData.schedule;
            const isPublished = currentScheduleData.isPublished;
            const lastPublishedAt = currentScheduleData.lastPublishedAt;

            // Audit Logs
            const [auditLogs, setAuditLogs] = useState(() => {
                const saved = localStorage.getItem('ayomi_audit_logs');
                return saved ? JSON.parse(saved) : [
                    { timestamp: '2026-10-28 09:00', user: 'Manager Klinik', action: 'Terbit Jadwal', details: 'Jadwal November 2026 resmi diterbitkan.' }
                ];
            });

            useEffect(() => {
                localStorage.setItem('ayomi_audit_logs', JSON.stringify(auditLogs));
            }, [auditLogs]);

            const [toastMessage, setToastMessage] = useState(null);
            const triggerToast = useCallback((msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 4500);
            }, []);

            const logAction = (action, details) => {
                const now = new Date();
                const timeStr = now.toISOString().replace('T', ' ').substring(0, 16);
                setAuditLogs(prev => [{ timestamp: timeStr, user: currentUser ? currentUser.name : 'System', action, details }, ...prev]);
            };

            // CAMERA & FACE DETECTION & GPS ABSENSI STATES
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [faceDetected, setFaceDetected] = useState(false);
            const [faceDetectMessage, setFaceDetectMessage] = useState('Menginisialisasi Kamera & Wajah...');
            const [capturedPhoto, setCapturedPhoto] = useState(null);
            const [gpsData, setGpsData] = useState({ lat: null, lng: null, accuracy: null, distance: null, isValid: false, error: '' });
            const [isGpsLoading, setIsGpsLoading] = useState(false);
            const [attendanceType, setAttendanceType] = useState('MASUK'); // MASUK or PULANG
            const [permissionNote, setPermissionNote] = useState('');
            const [isSubmittingAbsence, setIsSubmittingAbsence] = useState(false);

            // FACE DETECTION LOGIC (MediaPipe FaceDetector Integration)
            useEffect(() => {
                let faceDetection = null;
                let cameraUtils = null;

                if (isCameraActive && videoRef.current && window.FaceDetection) {
                    try {
                        faceDetection = new window.FaceDetection({
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                        });

                        faceDetection.setOptions({
                            model: 'short',
                            minDetectionConfidence: 0.55
                        });

                        faceDetection.onResults((results) => {
                            if (results.detections && results.detections.length > 0) {
                                setFaceDetected(true);
                                setFaceDetectMessage('✅ Wajah Terdeteksi Jelas! Siap Mengambil Foto');
                            } else {
                                setFaceDetected(false);
                                setFaceDetectMessage('⚠️ Wajah tidak terdeteksi / posisi kurang pas. Mohon posisikan wajah di dalam bingkai.');
                            }
                        });

                        if (window.Camera && videoRef.current) {
                            cameraUtils = new window.Camera(videoRef.current, {
                                onFrame: async () => {
                                    if (videoRef.current && faceDetection) {
                                        await faceDetection.send({ image: videoRef.current });
                                    }
                                },
                                width: 640,
                                height: 480
                            });
                            cameraUtils.start();
                        }
                    } catch (e) {
                        console.error('Face Detection Init Error:', e);
                        setFaceDetected(true); // Fallback to avoid blocking if CDN loaded incorrectly
                        setFaceDetectMessage('📸 Kamera Aktif');
                    }
                }

                return () => {
                    if (cameraUtils) cameraUtils.stop();
                };
            }, [isCameraActive]);

            // Start Camera Stream
            const startCamera = async () => {
                setCapturedPhoto(null);
                setFaceDetected(false);
                setFaceDetectMessage('Meminta izin kamera...');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setIsCameraActive(true);
                    }
                } catch (err) {
                    triggerToast('Gagal mengakses kamera. Mohon berikan izin kamera pada browser HP Anda.', 'error');
                }
            };

            const stopCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    const tracks = videoRef.current.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    videoRef.current.srcObject = null;
                }
                setIsCameraActive(false);
            };

            const captureSnap = () => {
                if (!faceDetected) {
                    triggerToast('Wajah tidak terdeteksi! Mohon posisikan wajah Anda di tengah kamera.', 'error');
                    return;
                }
                if (videoRef.current && canvasRef.current) {
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const photoData = canvas.toDataURL('image/jpeg', 0.85);
                    setCapturedPhoto(photoData);
                    stopCamera();
                    triggerToast('Foto berhasil diambil dengan verifikasi wajah!', 'success');
                }
            };

            // Get GPS Location
            const getLocation = () => {
                setIsGpsLoading(true);
                setGpsData(prev => ({ ...prev, error: '' }));

                if (!navigator.geolocation) {
                    setGpsData(prev => ({ ...prev, error: 'Geolocation tidak didukung oleh browser Anda.' }));
                    setIsGpsLoading(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        const accuracy = Math.round(position.coords.accuracy);

                        const dist = calculateHaversineDistance(userLat, userLng, CLINIC_LOCATION.lat, CLINIC_LOCATION.lng);
                        const isValid = dist <= CLINIC_LOCATION.maxRadiusMeters;

                        setGpsData({
                            lat: userLat,
                            lng: userLng,
                            accuracy,
                            distance: dist,
                            isValid,
                            error: isValid ? '' : `Anda berada ${dist} meter dari Klinik (Maksimal 50m).`
                        });
                        setIsGpsLoading(false);
                        if (isValid) {
                            triggerToast(`Lokasi Terverifikasi! Jarak dari Klinik: ${dist} meter.`, 'success');
                        } else {
                            triggerToast(`Di luar radius! Anda berjarak ${dist} meter dari klinik.`, 'error');
                        }
                    },
                    (err) => {
                        setIsGpsLoading(false);
                        setGpsData(prev => ({ ...prev, error: `Gagal memperoleh lokasi GPS: ${err.message}` }));
                        triggerToast('Akses GPS Ditolak / Tidak Ditemukan.', 'error');
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            };

            // Submit Attendance Action
            const handleSubmitAttendance = async () => {
                if (!capturedPhoto) {
                    triggerToast('Foto absensi wajib diambil menggunakan kamera.', 'error');
                    return;
                }
                if (!gpsData.isValid) {
                    triggerToast('Lokasi GPS tidak valid / di luar radius 50 meter dari klinik.', 'error');
                    return;
                }

                const todayStr = new Date().toISOString().split('T')[0];
                const nowTime = new Date();
                const serverTimeStr = nowTime.toTimeString().substring(0, 5); // HH:MM
                const fullTimestamp = `${todayStr} ${serverTimeStr}:${String(nowTime.getSeconds()).padStart(2, '0')}`;

                // Check Schedule
                const todayRoster = schedule[todayStr];
                const empShift = todayRoster?.assignments[currentUser.name];

                if (!empShift || empShift === 'Libur' || empShift === 'KLINIK TUTUP') {
                    triggerToast('Anda tidak memiliki jadwal kerja aktif pada hari ini.', 'error');
                    return;
                }

                // Check duplicate
                const existing = attendanceLogs.find(a => a.employee_name === currentUser.name && a.date === todayStr && a.type === attendanceType);
                if (existing) {
                    triggerToast(`Anda sudah melakukan Absen ${attendanceType} untuk hari ini.`, 'error');
                    return;
                }

                setIsSubmittingAbsence(true);

                // Calculate Late / Early Exit
                let lateMinutes = 0;
                let earlyMinutes = 0;
                let statusPresence = 'Tepat Waktu';

                const shiftRef = SHIFT_HOURS[empShift] || { start: '08:00', end: '16:00' };

                if (attendanceType === 'MASUK') {
                    const [schedH, schedM] = shiftRef.start.split(':').map(Number);
                    const schedStartSec = schedH * 60 + schedM;
                    const actualSec = nowTime.getHours() * 60 + nowTime.getMinutes();

                    if (actualSec > schedStartSec) {
                        lateMinutes = actualSec - schedStartSec;
                        statusPresence = `Terlambat ${lateMinutes} Menit`;
                    } else {
                        statusPresence = 'Tepat Waktu';
                    }
                } else {
                    // PULANG
                    const [schedH, schedM] = shiftRef.end.split(':').map(Number);
                    const schedEndSec = schedH * 60 + schedM;
                    const actualSec = nowTime.getHours() * 60 + nowTime.getMinutes();

                    if (actualSec < schedEndSec) {
                        earlyMinutes = schedEndSec - actualSec;
                        statusPresence = permissionNote ? `Pulang Lebih Awal dengan Izin (${earlyMinutes} m)` : `Pulang Lebih Awal ${earlyMinutes} Menit`;
                    } else {
                        statusPresence = 'Sesuai Jadwal';
                    }
                }

                const newRecord = {
                    id: `att_${Date.now()}`,
                    employee_id: currentUser.employeeId || currentUser.username,
                    employee_name: currentUser.name,
                    date: todayStr,
                    timestamp: fullTimestamp,
                    time: serverTimeStr,
                    type: attendanceType,
                    photo_url: capturedPhoto,
                    lat: gpsData.lat,
                    lng: gpsData.lng,
                    accuracy: gpsData.accuracy,
                    distance_meters: gpsData.distance,
                    status_location: 'VALID',
                    status_presence: statusPresence,
                    scheduled_shift: empShift,
                    scheduled_start: shiftRef.start,
                    scheduled_end: shiftRef.end,
                    late_minutes: lateMinutes,
                    early_minutes: earlyMinutes,
                    face_verified: true,
                    note: permissionNote || ''
                };

                // Save to Supabase DB if connected, else LocalStorage
                if (supabaseClient) {
                    try {
                        const { error } = await supabaseClient.from('attendance').insert([newRecord]);
                        if (error) console.error('Supabase save error:', error);
                    } catch(e) {}
                }

                setAttendanceLogs(prev => [newRecord, ...prev]);
                broadcastSync('UPDATE_ATTENDANCE', newRecord);
                logAction(`Absen ${attendanceType}`, `${currentUser.name} melakukan Absen ${attendanceType} (${statusPresence})`);
                
                setIsSubmittingAbsence(false);
                setCapturedPhoto(null);
                setPermissionNote('');
                triggerToast(`Absen ${attendanceType} Berhasil Disimpan! Status: ${statusPresence}`, 'success');
            };

            // LOGIN
            const handleLoginSubmit = (e) => {
                if (e) e.preventDefault();
                const acc = accounts.find(a => a.username.toLowerCase() === loginForm.username.toLowerCase().trim() && a.pass === loginForm.pass);
                if (acc) {

            const handleLogout = () => {

                stopCamera();
                triggerToast('Anda telah keluar dari akun.', 'info');

            // RENDER MANDATORY LOGIN VIEW
            if (!currentUser) {

                                        Username

                                    />
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-mulberry-950 uppercase tracking-wider block mb-1">
                                        Kata Sandi / Password
                                    </label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="Password..."
                                        value={loginForm.pass}
                                        onChange={(e) => setLoginForm(prev => ({ ...prev, pass: e.target.value }))}
                                        class="w-full border border-rosegold-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-champagne-500 font-medium bg-white text-mulberry-950"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    class="w-full bg-gradient-to-r from-rosegold-500 via-mulberry-700 to-mulberry-900 hover:from-rosegold-600 hover:to-mulberry-950 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center space-x-2 border border-champagne-300/40"
                                >
                                    <span>🔐</span>
                                    <span>Masuk ke Akun</span>
                                </button>
                            </form>

                            <div class="text-center pt-4 border-t border-rosegold-200/60">
                                <div class="text-[11px] text-mulberry-800 font-medium space-y-1">
                                    <p class="font-bold text-mulberry-950">PJ AYOMI BEAUTE CLINIC DAMPIT</p>
                                    <p class="text-[10px] text-mulberry-700">Manager Pass: @Adeeva0506 | Staf Pass: admin123</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div class="min-h-screen pb-12">
                    {/* TOAST NOTIFICATION CONTAINER */}
                    {toastMessage && (
                        <div class="fixed bottom-5 right-5 z-50 animate-bounce">
                            <div class={`px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold flex items-center space-x-2 ${
                                toastMessage.type === 'error' ? 'bg-rose-900 text-white border-rose-500' :

                                'bg-mulberry-900 text-champagne-200 border-champagne-400'
                            }`}>
                                <span>{toastMessage.type === 'error' ? '🚫' : toastMessage.type === 'success' ? '✅' : '📢'}</span>

                                        <span>•</span>
                                        <span class="bg-mulberry-800 text-champagne-200 border border-champagne-400/40 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase">{currentUser.role}</span>
                                    </div>

                            <div class="flex items-center space-x-3">

                                <div className={`flex items-center space-x-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold border ${

                    {/* MAIN CONTENT WRAPPER */}

                                    // Summary Stats for Logged In Employee for Selected Month
                                    let totalPagi = 0, totalSiang = 0, totalFull = 0, totalOB = 0, totalLibur = 0, totalWorkDays = 0;
                                    
                                    daysInMonthList.forEach(d => {
                                        const shiftVal = schedule[d.dateStr]?.assignments[myName];
                                        if (shiftVal === 'Pagi') { totalPagi++; totalWorkDays++; }
                                        else if (shiftVal === 'Siang') { totalSiang++; totalWorkDays++; }
                                        else if (shiftVal === 'Full Shift') { totalFull++; totalWorkDays++; }
                                        else if (shiftVal === 'OB') { totalOB++; totalWorkDays++; }
                                        else if (shiftVal === 'Libur' || shiftVal === 'KLINIK TUTUP') { totalLibur++; }
                                    });

                                    const totalHours = (totalPagi * 8) + (totalSiang * 8) + (totalFull * 11) + (totalOB * 8);

                                    // Filtered days list
                                    const filteredDays = daysInMonthList.filter(d => {
                                        const shiftVal = schedule[d.dateStr]?.assignments[myName];
                                        if (scheduleFilterShift === 'ALL') return true;
                                        if (scheduleFilterShift === 'WORK') return shiftVal && shiftVal !== 'Libur' && shiftVal !== 'KLINIK TUTUP';
                                        if (scheduleFilterShift === 'OFF') return shiftVal === 'Libur' || shiftVal === 'KLINIK TUTUP';
                                        return shiftVal === scheduleFilterShift;
                                    });

                                    return (
                                        <div class="space-y-6">
                                            {/* QUICK CARDS: TODAY & TOMORROW HIGHLIGHT */}
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {/* TODAY CARD */}
                                                <div class="bg-gradient-to-br from-cream-50 via-blush-50 to-cream-100 rounded-3xl p-5 shadow-lg border-2 border-mulberry-300 relative overflow-hidden">
                                                    <div class="flex items-center justify-between border-b border-rosegold-200 pb-3">
                                                        <div class="flex items-center space-x-2">
                                                            <span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-mulberry-900 text-champagne-200 shadow">
                                                                📌 Hari Ini ({todayDateStr})
                                                            </span>
                                                        </div>
                                                        <span class="text-xs font-bold text-mulberry-800">
                                                            {schedule[todayDateStr]?.dayName || ''}
                                                        </span>
                                                    </div>

                                                    <div class="mt-4 flex items-center justify-between">
                                                        <div>
                                                            <div class="text-xs text-mulberry-700 font-bold uppercase tracking-wide">Jadwal Shift Anda</div>
                                                            <div class="text-2xl font-extrabold text-mulberry-950 mt-1 flex items-center space-x-2">
                                                                <span>
                                                                    {todayShift === 'Pagi' ? '🌅' : todayShift === 'Siang' ? '🌤️' : todayShift === 'Full Shift' ? '⚡' : todayShift === 'Libur' ? '🌴' : '🏢'}
                                                                </span>
                                                                <span>{todayShift}</span>
                                                            </div>
                                                            <div class="text-xs font-semibold text-mulberry-800 mt-1">
                                                                {SHIFT_HOURS[todayShift] 
                                                                    ? `Jam Kerja: ${SHIFT_HOURS[todayShift].start} – ${SHIFT_HOURS[todayShift].end} WIB` 
                                                                    : todayShift === 'Libur' ? 'Hari Istirahat / Bebas Tugas' : 'Klinik Libur Operasional'}
                                                            </div>
                                                        </div>

                                                        {todayShift !== 'Libur' && todayShift !== 'KLINIK TUTUP' && todayShift !== 'Tidak Ada Data' && (
                                                            <button 
                                                                onClick={() => setActiveTab('attendance')}
                                                                class="bg-gradient-to-r from-emerald-600 to-emerald-800 hover:from-emerald-700 hover:to-emerald-900 text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-lg transition flex items-center space-x-1.5 border border-champagne-300/40"
                                                            >
                                                                <span>📸</span>
                                                                <span>Absen Sekarang</span>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* TOMORROW CARD */}
                                                <div class="bg-white rounded-3xl p-5 shadow-lg border border-rosegold-200 relative overflow-hidden">
                                                    <div class="flex items-center justify-between border-b border-cream-200 pb-3">
                                                        <div class="flex items-center space-x-2">
                                                            <span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-champagne-200 text-mulberry-950">
                                                                🌅 Besok ({tomorrowDateStr})
                                                            </span>
                                                        </div>
                                                        <span class="text-xs font-bold text-mulberry-700">
                                                            {schedule[tomorrowDateStr]?.dayName || ''}
                                                        </span>
                                                    </div>

                                                    <div class="mt-4">
                                                        <div class="text-xs text-mulberry-700 font-bold uppercase tracking-wide">Jadwal Shift Besok</div>
                                                        <div class="text-2xl font-extrabold text-mulberry-950 mt-1 flex items-center space-x-2">
                                                            <span>
                                                                {tomorrowShift === 'Pagi' ? '🌅' : tomorrowShift === 'Siang' ? '🌤️' : tomorrowShift === 'Full Shift' ? '⚡' : tomorrowShift === 'Libur' ? '🌴' : '🏢'}
                                                            </span>
                                                            <span>{tomorrowShift}</span>
                                                        </div>
                                                        <div class="text-xs font-semibold text-mulberry-800 mt-1">
                                                            {SHIFT_HOURS[tomorrowShift] 
                                                                ? `Jam Kerja: ${SHIFT_HOURS[tomorrowShift].start} – ${SHIFT_HOURS[tomorrowShift].end} WIB` 
                                                                : tomorrowShift === 'Libur' ? 'Hari Istirahat / Bebas Tugas' : 'Klinik Libur Operasional'}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* STATS OVERVIEW CARDS */}
                                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                                                <div class="bg-white p-4 rounded-2xl shadow border border-rosegold-200 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-mulberry-700 uppercase">Total Hari Kerja</div>
                                                    <div class="text-2xl font-black text-mulberry-950">{totalWorkDays} Hari</div>
                                                    <div class="text-[9px] text-mulberry-500 font-medium">Bulan {MONTH_NAMES[month-1]}</div>
                                                </div>

                                                <div class="bg-rose-50 p-4 rounded-2xl shadow border border-rose-200 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-rose-800 uppercase">Shift Pagi</div>
                                                    <div class="text-2xl font-black text-rose-950">{totalPagi} Shift</div>
                                                    <div class="text-[9px] text-rose-700 font-medium">08:00 - 16:00</div>
                                                </div>

                                                <div class="bg-amber-50 p-4 rounded-2xl shadow border border-amber-200 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-amber-800 uppercase">Shift Siang</div>
                                                    <div class="text-2xl font-black text-amber-950">{totalSiang} Shift</div>
                                                    <div class="text-[9px] text-amber-700 font-medium">11:00 - 19:00</div>
                                                </div>

                                                <div class="bg-purple-50 p-4 rounded-2xl shadow border border-purple-200 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-purple-800 uppercase">Full Shift</div>
                                                    <div class="text-2xl font-black text-purple-950">{totalFull} Shift</div>
                                                    <div class="text-[9px] text-purple-700 font-medium">08:00 - 19:00</div>
                                                </div>

                                                <div class="bg-slate-100 p-4 rounded-2xl shadow border border-slate-300 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-slate-700 uppercase">Hari Libur</div>
                                                    <div class="text-2xl font-black text-slate-900">{totalLibur} Hari</div>
                                                    <div class="text-[9px] text-slate-600 font-medium">Off / Tutup</div>
                                                </div>

                                                <div class="bg-emerald-50 p-4 rounded-2xl shadow border border-emerald-200 text-center space-y-1">
                                                    <div class="text-[10px] font-extrabold text-emerald-800 uppercase">Total Jam Kerja</div>
                                                    <div class="text-2xl font-black text-emerald-950">±{totalHours} Jam</div>
                                                    <div class="text-[9px] text-emerald-700 font-medium">Estimasi Jam</div>
                                                </div>
                                            </div>

                                            {/* DETAILED DAILY LIST FOR EMPLOYEES */}
                                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-rosegold-200 space-y-5">
                                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-cream-200 pb-4">
                                                    <div>
                                                        <h4 class="font-cinzel font-bold text-base text-mulberry-950 flex items-center space-x-2">
                                                            <span>📋</span>
                                                            <span>Daftar Rincian Shift Harian ({myName})</span>
                                                        </h4>
                                                        <p class="text-xs text-mulberry-700">Rincian tanggal demi tanggal untuk bulan {MONTH_NAMES[month-1]} {year}.</p>
                                                    </div>

                                                    {/* Shift Filter Dropdown */}
                                                    <div class="flex items-center space-x-2">
                                                        <span class="text-xs font-bold text-mulberry-900">Filter Shift:</span>
                                                        <select 
                                                            value={scheduleFilterShift}
                                                            onChange={(e) => setScheduleFilterShift(e.target.value)}
                                                            class="bg-cream-50 text-mulberry-950 font-bold border border-rosegold-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none"
                                                        >
                                                            <option value="ALL">Semua Tanggal ({daysInMonthList.length})</option>
                                                            <option value="WORK">Hanya Hari Kerja ({totalWorkDays})</option>
                                                            <option value="OFF">Hanya Hari Libur ({totalLibur})</option>
                                                            <option value="Pagi">Shift Pagi ({totalPagi})</option>
                                                            <option value="Siang">Shift Siang ({totalSiang})</option>
                                                            <option value="Full Shift">Full Shift ({totalFull})</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                {/* LIST GRID ITEMS */}
                                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                                    {filteredDays.map(d => {
                                                        const dateStr = d.dateStr;
                                                        const empShift = schedule[dateStr]?.assignments[myName] || 'Libur';
                                                        const isToday = dateStr === todayDateStr;
                                                        const isTomorrow = dateStr === tomorrowDateStr;

                                                        const shiftHourObj = SHIFT_HOURS[empShift];

                                                        return (
                                                            <div 
                                                                key={dateStr}
                                                                class={`p-4 rounded-2xl border transition-all space-y-2 relative ${
                                                                    isToday ? 'bg-gradient-to-br from-blush-100 to-cream-100 border-2 border-mulberry-700 shadow-md ring-2 ring-mulberry-400' :
                                                                    isTomorrow ? 'bg-champagne-100/60 border-champagne-300 shadow-sm' :
                                                                    empShift === 'Libur' || empShift === 'KLINIK TUTUP' ? 'bg-slate-50 border-slate-200 opacity-80' :
                                                                    'bg-white border-rosegold-200 hover:border-mulberry-400 shadow-sm'
                                                                }`}
                                                            >
                                                                <div class="flex items-center justify-between">
                                                                    <div class="flex items-center space-x-2">
                                                                        <span class="font-extrabold text-sm text-mulberry-950">{d.dayNum} {MONTH_NAMES[month-1]}</span>
                                                                        <span class="text-xs font-semibold text-mulberry-700">({d.dayName})</span>
                                                                    </div>

                                                                    {isToday && (
                                                                        <span class="bg-mulberry-900 text-champagne-200 font-extrabold text-[9px] px-2 py-0.5 rounded-full uppercase shadow">
                                                                            HARI INI
                                                                        </span>
                                                                    )}
                                                                    {isTomorrow && (
                                                                        <span class="bg-champagne-500 text-mulberry-950 font-extrabold text-[9px] px-2 py-0.5 rounded-full uppercase">
                                                                            BESOK
                                                                        </span>
                                                                    )}
                                                                </div>

                                                                <div class="flex items-center justify-between pt-1 border-t border-cream-200/80">
                                                                    <div>
                                                                        <div class="text-[10px] text-mulberry-600 font-bold uppercase">Status Shift</div>
                                                                        <div class="text-sm font-extrabold text-mulberry-950 flex items-center space-x-1 mt-0.5">
                                                                            <ShiftBadge name={empShift} shift={empShift} />
                                                                        </div>
                                                                    </div>

                                                                    <div class="text-right">
                                                                        <div class="text-[10px] text-mulberry-600 font-bold uppercase">Jam Kerja</div>
                                                                        <div class="text-xs font-bold text-mulberry-900 mt-0.5">
                                                                            {shiftHourObj ? `${shiftHourObj.start} - ${shiftHourObj.end}` : '-'}
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                {schedule[dateStr]?.note && (
                                                                    <div class="text-[10px] bg-champagne-200/60 text-mulberry-950 px-2 py-1 rounded-lg font-medium">
                                                                        📌 {schedule[dateStr].note}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* SUB VIEW 2: MONTHLY CALENDAR GRID VIEW */}
                                {scheduleSubTab === 'calendar' && (() => {
                                    const daysInMonthList = getDaysInMonth(year, month);
                                    const myName = currentUser.name;
                                    const todayDateStr = new Date().toISOString().split('T')[0];

                                    const firstDayOfWeek = daysInMonthList[0]?.dayOfWeek || 0;
                                    const blankDays = Array.from({ length: firstDayOfWeek });

                                    return (
                                        <div class="bg-white rounded-3xl p-6 shadow-xl border border-rosegold-200 space-y-4">
                                            <div class="flex items-center justify-between border-b border-cream-200 pb-3">
                                                <h4 class="font-cinzel font-bold text-base text-mulberry-950 flex items-center space-x-2">
                                                    <span>📆</span>
                                                    <span>Tampilan Kalender Bulanan — {MONTH_NAMES[month-1]} {year}</span>
                                                </h4>
                                                <span class="text-xs font-bold text-mulberry-700">Jadwal Staf: {myName}</span>
                                            </div>

                                            {/* DAY NAMES HEADER */}
                                            <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs uppercase text-mulberry-950 bg-cream-100 py-2.5 rounded-2xl border border-cream-200">
                                                <div class="text-rose-700">Minggu</div>
                                                <div>Senin</div>
                                                <div>Selasa</div>
                                                <div>Rabu</div>
                                                <div>Kamis</div>
                                                <div>Jumat</div>
                                                <div class="text-rose-700">Sabtu</div>
                                            </div>

                                            {/* CALENDAR TILES GRID */}
                                            <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                                                {blankDays.map((_, i) => (
                                                    <div key={`blank_${i}`} class="min-h-[80px] bg-cream-50/50 rounded-2xl border border-dashed border-cream-200/60"></div>
                                                ))}

                                                {daysInMonthList.map(d => {
                                                    const dateStr = d.dateStr;
                                                    const empShift = schedule[dateStr]?.assignments[myName] || 'Libur';
                                                    const isToday = dateStr === todayDateStr;
                                                    const isSun = d.dayOfWeek === 0;

                                                    return (
                                                        <div 
                                                            key={dateStr}
                                                            class={`min-h-[90px] p-2 rounded-2xl border flex flex-col justify-between transition-all ${
                                                                isToday ? 'bg-gradient-to-br from-blush-100 to-cream-100 border-2 border-mulberry-700 shadow-md ring-2 ring-mulberry-300' :
                                                                empShift === 'Libur' || empShift === 'KLINIK TUTUP' ? 'bg-slate-50 border-slate-200' :
                                                                'bg-white border-rosegold-200 hover:border-mulberry-400'
                                                            }`}
                                                        >
                                                            <div class="flex items-center justify-between">
                                                                <span class={`text-xs font-black ${isSun ? 'text-rose-700' : 'text-mulberry-950'}`}>
                                                                    {d.dayNum}
                                                                </span>
                                                                {isToday && (
                                                                    <span class="w-2 h-2 rounded-full bg-mulberry-700 animate-ping" title="Hari Ini"></span>
                                                                )}
                                                            </div>

                                                            <div class="my-1 text-center">
                                                                <ShiftBadge name={empShift} shift={empShift} isHighlighted={isToday} />
                                                            </div>

                                                            <div class="text-[9px] text-center text-mulberry-700 font-semibold truncate">
                                                                {SHIFT_HOURS[empShift] ? `${SHIFT_HOURS[empShift].start}` : empShift === 'Libur' ? 'Off' : ''}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* SUB VIEW 3: MATRIKS SELURUH STAF (TEAM MATRIX VIEW) */}
                                {scheduleSubTab === 'matrix' && (
                                    <div class="bg-white rounded-3xl p-6 shadow-xl border border-rosegold-200 space-y-4">
                                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-cream-200 pb-4">
                                            <div>
                                                <h4 class="font-cinzel font-bold text-base text-mulberry-950 flex items-center space-x-2">
                                                    <span>👥</span>
                                                    <span>Matriks Jadwal Shift Seluruh Pegawai Clinic ({MONTH_NAMES[month-1]} {year})</span>
                                                </h4>
                                                <p class="text-xs text-mulberry-700">Tampilan lengkap seluruh jadwal shift rekan kerja & operasional klinik.</p>
                                            </div>

                                            {currentUser.role === 'manager' && (
                                                <div class="flex items-center space-x-2">
                                                    <button 
                                                        onClick={() => {
                                                            const newSch = generateAutoSchedule(year, month, calendarEvents, employees);
                                                            setSchedulesStore(prev => ({
                                                                ...prev,
                                                                [currentMonthKey]: {
                                                                    schedule: newSch,
                                                                    isPublished: false,
                                                                    lastPublishedAt: null
                                                                }
                                                            }));
                                                            triggerToast('Jadwal berhasil digenerate ulang!', 'success');
                                                        }}
                                                        class="bg-cream-200 hover:bg-cream-300 text-mulberry-950 text-xs font-bold px-3 py-2 rounded-xl border border-cream-400"
                                                    >
                                                        🔄 Auto-Generate Jadwal
                                                    </button>

                                                    <button 
                                                        onClick={() => {
                                                            const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
                                                            setSchedulesStore(prev => ({
                                                                ...prev,
                                                                [currentMonthKey]: {
                                                                    ...prev[currentMonthKey],
                                                                    isPublished: true,
                                                                    lastPublishedAt: nowStr
                                                                }
                                                            }));
                                                            logAction('Terbit Jadwal', `Jadwal periode ${MONTH_NAMES[month-1]} ${year} diterbitkan.`);
                                                            triggerToast('Jadwal resmi diterbitkan!', 'success');
                                                        }}
                                                        class="bg-gradient-to-r from-rosegold-500 to-mulberry-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow border border-champagne-300/40"
                                                    >
                                                        📢 Terbitkan Jadwal
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left border-collapse min-w-[950px] text-xs">
                                                <thead>
                                                    <tr class="bg-mulberry-950 text-white uppercase tracking-wider">
                                                        <th class="p-3 border-b border-mulberry-800">Tanggal</th>
                                                        <th class="p-3 border-b border-mulberry-800">Hari</th>
                                                        {employees.map(e => {
                                                            const isMe = e.name === currentUser.name;
                                                            return (
                                                                <th key={e.id} class={`p-3 text-center border-b border-mulberry-800 ${isMe ? 'bg-mulberry-800 text-champagne-200 font-extrabold ring-2 ring-champagne-400' : ''}`}>
                                                                    {e.name}
                                                                    <div class="text-[9px] font-normal opacity-80 uppercase">{e.role}</div>
                                                                </th>
                                                            );
                                                        })}
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-cream-200 font-medium">
                                                    {getDaysInMonth(year, month).map(d => {
                                                        const isToday = d.dateStr === new Date().toISOString().split('T')[0];

                                                        return (
                                                            <tr key={d.dateStr} class={`hover:bg-cream-50 ${isToday ? 'bg-blush-100/70 font-bold' : ''}`}>
                                                                <td class="p-3 font-bold text-mulberry-950 whitespace-nowrap">
                                                                    {d.dateStr}
                                                                    {isToday && <span class="ml-1 text-[9px] bg-mulberry-900 text-champagne-200 px-1.5 py-0.5 rounded uppercase">HARI INI</span>}
                                                                </td>
                                                                <td class="p-3 text-mulberry-800">{d.dayName}</td>
                                                                {employees.map(e => {
                                                                    const isMe = e.name === currentUser.name;
                                                                    const currentShift = schedule[d.dateStr]?.assignments[e.name] || '-';

                                                                    return (
                                                                        <td key={e.id} class={`p-2.5 text-center ${isMe ? 'bg-champagne-100/40 font-bold' : ''}`}>
                                                                            <ShiftBadge 
                                                                                name={e.name} 
                                                                                shift={currentShift} 
                                                                                isHighlighted={isMe && isToday}
                                                                                onEdit={currentUser.role === 'manager' ? (newShift) => {
                                                                                    setSchedulesStore(prev => {
                                                                                        const updated = { ...prev };
                                                                                        if (updated[currentMonthKey]?.schedule[d.dateStr]) {
                                                                                            updated[currentMonthKey].schedule[d.dateStr].assignments[e.name] = newShift;
                                                                                        }
                                                                                        return { ...updated };
                                                                                    });
                                                                                    triggerToast(`Shift ${e.name} pada ${d.dateStr} diubah ke ${newShift}`, 'info');
                                                                                } : null}
                                                                            />
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
