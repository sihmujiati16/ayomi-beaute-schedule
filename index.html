        // ==========================================
        // UTILITY FUNCTIONS & SCHEDULER ALGORITHM

        function getDaysInMonth(year, month) {
            const date = new Date(year, month - 1, 1);
            const days = [];
            while (date.getMonth() === month - 1) {
                const dayOfWeek = date.getDay();
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                days.push({
                    dateStr,
                    dayNum: date.getDate(),
                    dayOfWeek,
                    dayName: DAY_NAMES[dayOfWeek],
                    isAllowedOffDay: ALLOWED_OFF_DAYS.includes(dayOfWeek)
                });
                date.setDate(date.getDate() + 1);
            }
            return days;
        }

        function generateAutoSchedule(year, month, calendarEvents, employeeList) {
            const monthDays = getDaysInMonth(year, month);
            const schedule = {};
            const activeEmployees = employeeList && employeeList.length > 0 ? employeeList : INITIAL_EMPLOYEES;
            
            const candidateOffDates = monthDays.filter(d => d.isAllowedOffDay && (calendarEvents[d.dateStr]?.isOpen !== false));

            const employeeOffDates = {};
            activeEmployees.forEach(emp => {
                employeeOffDates[emp.name] = [];
            });

            activeEmployees.forEach(emp => {
                const shuffled = [...candidateOffDates].sort(() => 0.5 - Math.random());
                let assigned = 0;
                for (let d of shuffled) {
                    if (assigned >= 2) break;
                    
                    const offListOnDate = Object.keys(employeeOffDates).filter(name => employeeOffDates[name].includes(d.dateStr));
                    if (offListOnDate.length >= 2) continue;

                    const sameRoleOff = offListOnDate.some(offName => {
                        const existingEmp = activeEmployees.find(e => e.name === offName);
                        return existingEmp && existingEmp.role === emp.role;
                    });

                    if (!sameRoleOff) {
                        employeeOffDates[emp.name].push(d.dateStr);
                        assigned++;
                    }
                }
            });

            monthDays.forEach(d => {
                const dateStr = d.dateStr;
                const isClosed = calendarEvents[dateStr] && !calendarEvents[dateStr].isOpen;

                const dailyRoster = {
                    dateStr,
                    dayName: d.dayName,
                    status: isClosed ? 'CLOSED' : 'OPEN',
                    note: calendarEvents[dateStr]?.title || '',
                    assignments: {}
                };

                if (isClosed) {
                    activeEmployees.forEach(emp => {
                        dailyRoster.assignments[emp.name] = 'KLINIK TUTUP';
                    });
                } else {
                    const admins = activeEmployees.filter(e => e.role === 'Admin').map(e => e.name);
                    const rereOff = employeeOffDates['Rere']?.includes(dateStr);
                    const vankaOff = employeeOffDates['Vanka']?.includes(dateStr);

                    if (admins.includes('Rere') && admins.includes('Vanka')) {
                        if (rereOff) {
                            dailyRoster.assignments['Rere'] = 'Libur';
                            dailyRoster.assignments['Vanka'] = 'Full Shift';
                        } else if (vankaOff) {
                            dailyRoster.assignments['Vanka'] = 'Libur';
                            dailyRoster.assignments['Rere'] = 'Full Shift';
                        } else {
                            const isVankaFixedPagiDay = [1, 2, 4, 5].includes(d.dayOfWeek);
                            if (isVankaFixedPagiDay) {
                                dailyRoster.assignments['Vanka'] = 'Pagi';
                                dailyRoster.assignments['Rere'] = 'Siang';
                            } else {
                                if (d.dayNum % 2 === 0) {
                                    dailyRoster.assignments['Rere'] = 'Pagi';
                                    dailyRoster.assignments['Vanka'] = 'Siang';
                                } else {
                                    dailyRoster.assignments['Rere'] = 'Siang';
                                    dailyRoster.assignments['Vanka'] = 'Pagi';
                                }
                            }
                        }
                    } else {
                        admins.forEach((admName, idx) => {
                            if (employeeOffDates[admName]?.includes(dateStr)) {
                                dailyRoster.assignments[admName] = 'Libur';
                            } else {
                                dailyRoster.assignments[admName] = idx % 2 === 0 ? 'Pagi' : 'Siang';
                            }
                        });
                    }

                    const therapists = activeEmployees.filter(e => e.role === 'Terapis').map(e => e.name);
                    const offTherapist = therapists.find(t => employeeOffDates[t]?.includes(dateStr));

                    therapists.forEach(t => {
                        if (employeeOffDates[t]?.includes(dateStr)) {
                            dailyRoster.assignments[t] = 'Libur';
                        }
                    });

                    const workingTherapists = therapists.filter(t => !employeeOffDates[t]?.includes(dateStr));

                    if (offTherapist) {
                        let pagiAssigns = [];
                        let siangAssigns = [];

                        workingTherapists.forEach(t => {
                            if (t === 'Belina') {
                                if (d.dayNum % 2 === 1) siangAssigns.push(t); else pagiAssigns.push(t);
                            } else if (t === 'Aura') {
                                if (d.dayNum % 2 === 1) pagiAssigns.push(t); else siangAssigns.push(t);
                            } else if (t === 'Lala') {
                                if (d.dayNum % 2 === 0) siangAssigns.push(t); else pagiAssigns.push(t);
                            } else if (t === 'Erlita') {
                                if (d.dayNum % 2 === 0) pagiAssigns.push(t); else siangAssigns.push(t);
                            } else {
                                if (pagiAssigns.length < 2) pagiAssigns.push(t); else siangAssigns.push(t);
                            }
                        });

                        while (pagiAssigns.length > 2 && siangAssigns.length < 2) {
                            siangAssigns.push(pagiAssigns.pop());
                        }
                        while (siangAssigns.length > 2 && pagiAssigns.length < 2) {
                            pagiAssigns.push(siangAssigns.pop());
                        }

                        pagiAssigns.forEach(t => dailyRoster.assignments[t] = 'Pagi');
                        siangAssigns.forEach(t => dailyRoster.assignments[t] = 'Siang');
                    } else {
                        therapists.forEach((tName, idx) => {
                            if (!dailyRoster.assignments[tName]) {
                                if (tName === 'Belina') dailyRoster.assignments[tName] = d.dayNum % 2 === 1 ? 'Siang' : 'Pagi';
                                else if (tName === 'Aura') dailyRoster.assignments[tName] = d.dayNum % 2 === 1 ? 'Pagi' : 'Siang';
                                else if (tName === 'Lala') dailyRoster.assignments[tName] = d.dayNum % 2 === 0 ? 'Siang' : 'Pagi';
                                else if (tName === 'Erlita') dailyRoster.assignments[tName] = d.dayNum % 2 === 0 ? 'Pagi' : 'Siang';
                                else if (tName === 'Ervina') dailyRoster.assignments[tName] = 'Siang';
                                else dailyRoster.assignments[tName] = idx % 2 === 0 ? 'Pagi' : 'Siang';
                            }
                        });
                    }

                    const otherEmployees = activeEmployees.filter(e => !['Admin', 'Terapis'].includes(e.role));
                    otherEmployees.forEach(emp => {
                        if (employeeOffDates[emp.name]?.includes(dateStr)) {
                            dailyRoster.assignments[emp.name] = 'Libur';
                        } else {
                            dailyRoster.assignments[emp.name] = emp.role === 'OB' ? 'OB' : 'Pagi';
                        }
                    });
                }

                schedule[dateStr] = dailyRoster;
            });

            return schedule;
        }

        function validateScheduleRules(schedule, year, month, calendarEvents, employeeList) {
            const errors = [];
            const warnings = [];
            const monthDays = getDaysInMonth(year, month);
            const activeEmployees = employeeList || INITIAL_EMPLOYEES;

            const employeeOffCounts = {};
            activeEmployees.forEach(emp => {
                employeeOffCounts[emp.name] = 0;
            });

            monthDays.forEach(d => {
                const dateStr = d.dateStr;
                const roster = schedule[dateStr];
                if (!roster) return;

                const isClinicClosed = calendarEvents[dateStr] && !calendarEvents[dateStr].isOpen;
                const offEmployees = activeEmployees.filter(emp => roster.assignments[emp.name] === 'Libur');

                activeEmployees.forEach(emp => {
                    const shift = roster.assignments[emp.name];
                    if (shift === 'Libur') {
                        employeeOffCounts[emp.name]++;
                    }
                });

                if (!isClinicClosed) {
                    if ([1, 2, 4, 5].includes(d.dayOfWeek)) {
                        offEmployees.forEach(emp => {
                            errors.push(`Hari Libur Terlarang: ${emp.name} libur pada ${d.dayName}, ${dateStr}. Pegawai tidak boleh libur pada Senin, Selasa, Kamis, & Jumat.`);
                        });
                    }

                    if (offEmployees.length > 2) {
                        errors.push(`Batas Maksimal Libur: Terdapat ${offEmployees.length} pegawai libur pada ${dateStr} (Maksimal 2 pegawai).`);
                    }

                    if (offEmployees.length === 2) {
                        const role1 = offEmployees[0].role;
                        const role2 = offEmployees[1].role;
                        if (role1 === role2) {
                            errors.push(`Konflik Divisi Libur: ${offEmployees[0].name} dan ${offEmployees[1].name} (${role1}) libur bersamaan pada ${dateStr}.`);
                        }
                    }

                    const rereShift = roster.assignments['Rere'];
                    const vankaShift = roster.assignments['Vanka'];

                    if (rereShift && vankaShift) {
                        if (rereShift === 'Libur' && vankaShift === 'Libur') {
                            errors.push(`Konflik Admin: Rere & Vanka libur bersamaan pada tanggal ${dateStr}.`);
                        }
                        if (rereShift === 'Libur' && vankaShift !== 'Full Shift') {
                            errors.push(`Konflik Shift Admin: Rere libur pada ${dateStr}, Vanka harus Full Shift.`);
                        }
                        if (vankaShift === 'Libur' && rereShift !== 'Full Shift') {
                            errors.push(`Konflik Shift Admin: Vanka libur pada ${dateStr}, Rere harus Full Shift.`);
                        }
                    }

                    const belinaShift = roster.assignments['Belina'];
                    const auraShift = roster.assignments['Aura'];
                    if (belinaShift && auraShift && belinaShift !== 'Libur' && belinaShift === auraShift) {
                        errors.push(`Pelanggaran Terapis: Belina dan Aura berada pada shift yang sama (${belinaShift}) pada ${dateStr}.`);
                    }

                    const lalaShift = roster.assignments['Lala'];
                    const erlitaShift = roster.assignments['Erlita'];
                    if (lalaShift && erlitaShift && lalaShift !== 'Libur' && lalaShift === erlitaShift) {
                        errors.push(`Pelanggaran Terapis: Lala dan Erlita berada pada shift yang sama (${lalaShift}) pada ${dateStr}.`);
                    }
                }
            });

            activeEmployees.forEach(emp => {
                if (employeeOffCounts[emp.name] !== 2) {
                    warnings.push(`Jatah Libur: ${emp.name} memiliki ${employeeOffCounts[emp.name]} hari libur (Ketentuan: Tepat 2 hari).`);
                }
            });

            return {
                status: errors.length > 0 ? 'TIDAK VALID' : warnings.length > 0 ? 'PERINGATAN' : 'VALID',
                errors,
                warnings,
                employeeOffCounts
            };
        }

        // ==========================================
        // SHIFT BADGE COMPONENT WITH HIGHLIGHT
        // ==========================================
        function ShiftBadge({ name, shift, onEdit, isHighlighted }) {
            const shiftStyles = {
                'Pagi': 'bg-rose-100 text-rose-950 border-rose-300',

            return (

                    {shift === 'Full Shift' && <span class="text-[9px] bg-purple-800 text-white px-1 rounded">FULL</span>}

                            value={shift}

                            class="ml-1 bg-white/90 text-mulberry-950 font-bold border border-mulberry-300 rounded text-[10px] focus:outline-none cursor-pointer px-0.5"
                            onClick={(e) => e.stopPropagation()}
                        >

                            <option value="Siang">Siang</option>
                            <option value="Full Shift">Full</option>
                            <option value="OB">OB</option>
                            <option value="Libur">Libur</option>
                        </select>
                    )}

            );

            const [announcements, setAnnouncements] = useState(() => {
                const saved = localStorage.getItem('ayomi_announcements');
                return saved ? JSON.parse(saved) : INITIAL_ANNOUNCEMENTS;
            });

            useEffect(() => {
                localStorage.setItem('ayomi_announcements', JSON.stringify(announcements));
            }, [announcements]);

            const [newAnnForm, setNewAnnForm] = useState({
                title: '',
                category: 'Informasi Umum',
                content: '',
                priority: 'normal',
                targetRole: 'Semua Pegawai',
                isPinned: false
            });
            const [editingAnnId, setEditingAnnId] = useState(null);
            const [annSearch, setAnnSearch] = useState('');
            const [annCategoryFilter, setAnnCategoryFilter] = useState('ALL');

            // Schedules Store Persisted in LocalStorage
            const [schedulesStore, setSchedulesStore] = useState(() => {
                const saved = localStorage.getItem('ayomi_schedules_store');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                const initialKey = '2026-11';
                return {
                    [initialKey]: {
                        schedule: generateAutoSchedule(2026, 11, INITIAL_CALENDAR_EVENTS, INITIAL_EMPLOYEES),
                        isPublished: true,
                        lastPublishedAt: '2026-10-28 09:00'
                    }
                };
            });

            useEffect(() => {
                localStorage.setItem('ayomi_schedules_store', JSON.stringify(schedulesStore));
            }, [schedulesStore]);

            const currentMonthKey = `${year}-${String(month).padStart(2, '0')}`;

            const currentScheduleData = useMemo(() => {
                if (!schedulesStore[currentMonthKey]) {
                    return {
                        schedule: generateAutoSchedule(year, month, calendarEvents, employees),
                        isPublished: false,
                        lastPublishedAt: null
                    };
                }
                return schedulesStore[currentMonthKey];
            }, [schedulesStore, currentMonthKey, year, month, calendarEvents, employees]);

            const schedule = currentScheduleData.schedule;
            const isPublished = currentScheduleData.isPublished;
            const lastPublishedAt = currentScheduleData.lastPublishedAt;

            const [auditLogs, setAuditLogs] = useState(() => {
                const saved = localStorage.getItem('ayomi_audit_logs');
                return saved ? JSON.parse(saved) : [
                    { timestamp: '2026-10-28 09:00', user: 'Manager Klinik', action: 'Terbit Jadwal', details: 'Jadwal November 2026 resmi diterbitkan.' }
                ];
            });

            useEffect(() => {
                localStorage.setItem('ayomi_audit_logs', JSON.stringify(auditLogs));
            }, [auditLogs]);

            const [editingDateRow, setEditingDateRow] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [searchStaff, setSearchStaff] = useState('');
            const [filterShift, setFilterShift] = useState('ALL');

            const triggerToast = useCallback((msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 4500);
            }, []);

            // REAL-TIME LISTENER FOR MULTI-TAB & MULTI-WINDOW SYNC
            useEffect(() => {
                const handleBroadcastMessage = (event) => {
                    const data = event.data;
                    if (!data) return;

                    if (data.actionType === 'UPDATE_SCHEDULE_STORE') {
                        setSchedulesStore(data.payload);
                        triggerToast("📢 Real-time Update: Manager telah meng-update jadwal operasional!", "info");
                    } else if (data.actionType === 'UPDATE_ANNOUNCEMENTS') {
                        setAnnouncements(data.payload);
                        triggerToast("📢 Pengumuman Baru: Manager menerbitkan pengumuman terbaru!", "success");
                    } else if (data.actionType === 'UPDATE_EMPLOYEES') {
                        setEmployees(data.payload);
                    } else if (data.actionType === 'UPDATE_CALENDAR') {
                        setCalendarEvents(data.payload);
                    }
                };

                if (syncChannelRef.current) {
                    syncChannelRef.current.onmessage = handleBroadcastMessage;
                }

                // Storage event fallback for cross-tab updates
                const handleStorageEvent = (e) => {
                    if (e.key === 'ayomi_schedules_store' && e.newValue) {
                        try {
                            setSchedulesStore(JSON.parse(e.newValue));
                            triggerToast("⚡ Perubahan Jadwal Terdeteksi secara Real-Time!", "info");
                        } catch(err){}
                    }
                    if (e.key === 'ayomi_announcements' && e.newValue) {
                        try {
                            setAnnouncements(JSON.parse(e.newValue));
                            triggerToast("📢 Pengumuman Terkini telah diperbarui oleh Manager!", "success");
                        } catch(err){}
                    }
                    if (e.key === 'ayomi_employees' && e.newValue) {
                        try { setEmployees(JSON.parse(e.newValue)); } catch(err){}
                    }
                };

                window.addEventListener('storage', handleStorageEvent);
                return () => {
                    window.removeEventListener('storage', handleStorageEvent);
                };
            }, [triggerToast]);

            const logAction = (action, details) => {
                const now = new Date();
                const timeStr = now.toISOString().replace('T', ' ').substring(0, 16);
                setAuditLogs(prev => {
                    const updated = [{
                        timestamp: timeStr,
                        user: currentUser ? currentUser.name : 'System',
                        action,
                        details
                    }, ...prev];
                    return updated;
                });
            };

            const validationReport = useMemo(() => {
                return validateScheduleRules(schedule, year, month, calendarEvents, employees);
            }, [schedule, year, month, calendarEvents, employees]);

            const checkManagerAccess = (actionName) => {
                if (!currentUser || currentUser.role !== 'manager') {
                    triggerToast("Akses ditolak. Anda tidak memiliki izin untuk mengelola data.", "error");
                    return false;
                }
                return true;
            };

            const updateActiveSchedule = (newSchedule, newIsPublished, newPublishedAt) => {
                setSchedulesStore(prev => {
                    const updated = {
                        ...prev,
                        [currentMonthKey]: {
                            schedule: newSchedule !== undefined ? newSchedule : (prev[currentMonthKey]?.schedule || schedule),
                            isPublished: newIsPublished !== undefined ? newIsPublished : (prev[currentMonthKey]?.isPublished ?? false),
                            lastPublishedAt: newPublishedAt !== undefined ? newPublishedAt : (prev[currentMonthKey]?.lastPublishedAt || null)
                        }
                    };
                    broadcastSync('UPDATE_SCHEDULE_STORE', updated);
                    return updated;
                });
            };

            // ANNOUNCEMENT ACTIONS (MANAGER)
            const handleSaveAnnouncement = (e) => {
                if (e) e.preventDefault();
                if (!checkManagerAccess("Kelola Pengumuman")) return;

                if (!newAnnForm.title.trim() || !newAnnForm.content.trim()) {
                    triggerToast("Judul dan isi pengumuman tidak boleh kosong.", "error");
                    return;
                }

                const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);

                if (editingAnnId) {
                    const updatedList = announcements.map(ann => ann.id === editingAnnId ? {
                        ...ann,
                        title: newAnnForm.title.trim(),
                        category: newAnnForm.category,
                        content: newAnnForm.content.trim(),
                        priority: newAnnForm.priority,
                        targetRole: newAnnForm.targetRole,
                        isPinned: newAnnForm.isPinned,
                        updatedAt: nowStr
                    } : ann);

                    setAnnouncements(updatedList);
                    broadcastSync('UPDATE_ANNOUNCEMENTS', updatedList);
                    logAction("Edit Pengumuman", `Memperbarui pengumuman: "${newAnnForm.title}"`);
                    triggerToast("Pengumuman berhasil diperbarui dan dipublikasikan real-time!", "success");
                    setEditingAnnId(null);
                } else {
                    const newAnn = {
                        id: `ann_${Date.now()}`,
                        title: newAnnForm.title.trim(),
                        category: newAnnForm.category,
                        content: newAnnForm.content.trim(),
                        priority: newAnnForm.priority,
                        targetRole: newAnnForm.targetRole,
                        isPinned: newAnnForm.isPinned,
                        createdAt: nowStr,
                        author: currentUser.name
                    };

                    const updatedList = [newAnn, ...announcements];
                    setAnnouncements(updatedList);
                    broadcastSync('UPDATE_ANNOUNCEMENTS', updatedList);
                    logAction("Buat Pengumuman", `Menerbitkan pengumuman baru: "${newAnnForm.title}"`);
                    triggerToast("Pengumuman baru berhasil diterbitkan dan langsung muncul di akun pegawai!", "success");
                }

                setNewAnnForm({
                    title: '',
                    category: 'Informasi Umum',
                    content: '',
                    priority: 'normal',
                    targetRole: 'Semua Pegawai',
                    isPinned: false
                });
            };

            const handleDeleteAnnouncement = (id) => {
                if (!checkManagerAccess("Hapus Pengumuman")) return;
                const annToDelete = announcements.find(a => a.id === id);
                const updatedList = announcements.filter(a => a.id !== id);
                setAnnouncements(updatedList);
                broadcastSync('UPDATE_ANNOUNCEMENTS', updatedList);
                logAction("Hapus Pengumuman", `Menghapus pengumuman: "${annToDelete?.title || id}"`);
                triggerToast("Pengumuman berhasil dihapus.", "info");
            };

            const handleTogglePinAnnouncement = (id) => {
                if (!checkManagerAccess("Pin Pengumuman")) return;
                const updatedList = announcements.map(ann => ann.id === id ? { ...ann, isPinned: !ann.isPinned } : ann);
                setAnnouncements(updatedList);
                broadcastSync('UPDATE_ANNOUNCEMENTS', updatedList);
                triggerToast("Status pin pengumuman diperbarui.", "info");
            };

            const handleAddEmployee = (e) => {
                if (e) e.preventDefault();
                if (!checkManagerAccess("Tambah Pegawai")) return;

                const nameTrimmed = newEmpForm.name.trim();
                if (!nameTrimmed) {
                    triggerToast("Nama pegawai tidak boleh kosong.", "error");
                    return;
                }

                if (employees.some(emp => emp.name.toLowerCase() === nameTrimmed.toLowerCase())) {
                    triggerToast(`Pegawai dengan nama "${nameTrimmed}" sudah ada dalam daftar.`, "error");
                    return;
                }

                const newId = `emp_${Date.now()}`;
                const newEmp = {
                    id: newId,
                    name: nameTrimmed,
                    role: newEmpForm.role,
                    defaultShift: newEmpForm.role
                };

                const updatedList = [...employees, newEmp];
                setEmployees(updatedList);
                broadcastSync('UPDATE_EMPLOYEES', updatedList);
                setNewEmpForm({ name: '', role: 'Terapis', defaultShift: 'Terapis' });

                if (!isPublished) {
                    const newSched = generateAutoSchedule(year, month, calendarEvents, updatedList);
                    updateActiveSchedule(newSched, false, lastPublishedAt);
                }

                logAction("Tambah Pegawai", `Menambahkan pegawai baru: ${nameTrimmed} (${newEmpForm.role})`);
                triggerToast(`Pegawai ${nameTrimmed} (${newEmpForm.role}) berhasil ditambahkan! Password default: admin123`, "success");
            };

            const handleDeleteEmployee = (empId) => {
                if (!checkManagerAccess("Hapus Pegawai")) return;
                const empToDelete = employees.find(e => e.id === empId);
                if (!empToDelete) return;

                const updatedList = employees.filter(e => e.id !== empId);
                setEmployees(updatedList);
                broadcastSync('UPDATE_EMPLOYEES', updatedList);
                setDeletingEmpId(null);

                if (!isPublished) {
                    const newSched = generateAutoSchedule(year, month, calendarEvents, updatedList);
                    updateActiveSchedule(newSched, false, lastPublishedAt);
                }

                logAction("Hapus Pegawai", `Menghapus pegawai: ${empToDelete.name} (${empToDelete.role})`);
                triggerToast(`Pegawai ${empToDelete.name} berhasil dihapus dari sistem.`, "info");
            };

            const handleGenerateSchedule = () => {
                if (!checkManagerAccess("Generate Schedule")) return;
                if (isPublished) {
                    triggerToast("Jadwal bulan ini telah DITERBITKAN & TERKUNCI. Tarik jadwal terlebih dahulu jika ingin meng-generate ulang!", "error");
                    return;
                }
                const newSched = generateAutoSchedule(year, month, calendarEvents, employees);
                updateActiveSchedule(newSched, false, lastPublishedAt);
                logAction("Generate Schedule", `Generator otomatis membuat draft jadwal baru bulan ${MONTH_NAMES[month - 1]} ${year}`);
                triggerToast(`Jadwal otomatis ${MONTH_NAMES[month - 1]} ${year} berhasil digenerate!`, "success");
            };

            const handleCellEdit = (dateStr, empName, newShift) => {
                if (!checkManagerAccess("Edit Shift")) return;

                if (isPublished) {
                    triggerToast("🚫 JADWAL RESMI TERKUNCI! Silakan tekan 'Tarik Jadwal' terlebih dahulu untuk melakukan revisi.", "error");
                    return;
                }

                const prevShift = schedule[dateStr]?.assignments[empName];
                const updatedSchedule = {
                    ...schedule,
                    [dateStr]: {
                        ...schedule[dateStr],
                        assignments: {
                            ...schedule[dateStr].assignments,
                            [empName]: newShift
                        }
                    }
                };

                updateActiveSchedule(updatedSchedule, false, lastPublishedAt);
                logAction("Edit Shift", `Mengubah ${empName} pada ${dateStr} dari '${prevShift}' menjadi '${newShift}'`);
                triggerToast(`Shift ${empName} pada ${dateStr} diperbarui real-time.`, "info");
            };

            const handlePublishSchedule = () => {
                if (!checkManagerAccess("Publish Schedule")) return;
                if (validationReport.status === 'TIDAK VALID') {
                    triggerToast("Gagal menerbitkan! Masih terdapat Pelanggaran Aturan Wajib pada jadwal.", "error");
                    return;
                }
                const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
                updateActiveSchedule(schedule, true, nowStr);
                logAction("Terbit Jadwal", `Jadwal resmi bulan ${MONTH_NAMES[month - 1]} ${year} telah dipublikasikan.`);
                triggerToast(`Jadwal resmi ${MONTH_NAMES[month - 1]} ${year} berhasil dipublikasikan real-time untuk seluruh pegawai!`, "success");
            };

            const handleUnpublishSchedule = () => {
                if (!checkManagerAccess("Tarik Jadwal")) return;
                updateActiveSchedule(schedule, false, lastPublishedAt);
                logAction("Tarik Jadwal", `Manager menarik kembali publikasi jadwal resmi bulan ${MONTH_NAMES[month - 1]} ${year} menjadi status Draft/Revisi.`);
                triggerToast(`Jadwal resmi ${MONTH_NAMES[month - 1]} ${year} telah ditarik kembali! Status jadwal saat ini: Draft / Revisi.`, "info");
            };

            const handleLoginSubmit = (e) => {
                if (e) e.preventDefault();
                const acc = accounts.find(a => a.username.toLowerCase() === loginForm.username.toLowerCase().trim() && a.pass === loginForm.pass);
                if (acc) {
                    setCurrentUser(acc);
                    setLoginForm({ username: '', pass: '' });
                    setAuthError('');
                    triggerToast(`Selamat datang, ${acc.name}! Anda masuk sebagai ${acc.role.toUpperCase()}.`, "success");
                } else {
                    setAuthError('Username atau kata sandi tidak valid.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                triggerToast("Anda telah keluar dari sistem.", "info");
            };

            const filteredAnnouncements = useMemo(() => {
                return announcements.filter(ann => {
                    const matchesCategory = annCategoryFilter === 'ALL' || ann.category === annCategoryFilter;
                    const matchesSearch = ann.title.toLowerCase().includes(annSearch.toLowerCase()) || ann.content.toLowerCase().includes(annSearch.toLowerCase());
                    const matchesTarget = !currentUser || currentUser.role === 'manager' || ann.targetRole === 'Semua Pegawai' || ann.targetRole === currentUser.role;
                    return matchesCategory && matchesSearch && matchesTarget;
                }).sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            }, [announcements, annCategoryFilter, annSearch, currentUser]);

            const pinnedAnnouncements = useMemo(() => {
                return announcements.filter(a => a.isPinned && (!currentUser || currentUser.role === 'manager' || a.targetRole === 'Semua Pegawai' || a.targetRole === currentUser.role));
            }, [announcements, currentUser]);

            const recapData = useMemo(() => {
                const monthDays = getDaysInMonth(year, month);
                return employees.map(emp => {
                    let totalWorkDays = 0;
                    let totalOffDays = 0;
                    let pagiCount = 0;
                    let siangCount = 0;
                    let fullShiftCount = 0;
                    let obCount = 0;
                    let totalHours = 0;
                    let breakHours = 0;
                    const offDatesList = [];

                    monthDays.forEach(d => {
                        const shift = schedule[d.dateStr]?.assignments[emp.name];
                        if (shift === 'Libur') {
                            totalOffDays++;
                            offDatesList.push(`${d.dayName}, ${d.dayNum}`);
                        } else if (shift === 'Pagi') {
                            totalWorkDays++;
                            pagiCount++;
                            totalHours += 8;
                            breakHours += 1;
                        } else if (shift === 'Siang') {
                            totalWorkDays++;
                            siangCount++;
                            totalHours += 8;
                            breakHours += 1;
                        } else if (shift === 'Full Shift') {
                            totalWorkDays++;
                            fullShiftCount++;
                            totalHours += 13;
                            breakHours += 2;
                        } else if (shift === 'OB') {
                            totalWorkDays++;
                            obCount++;
                            totalHours += 8;
                            breakHours += 1;
                        }
                    });

                    return {
                        name: emp.name,
                        role: emp.role,
                        totalWorkDays,
                        totalOffDays,
                        pagiCount,
                        siangCount,
                        fullShiftCount,
                        obCount,
                        totalHours,
                        breakHours,
                        effectiveHours: totalHours - breakHours,
                        offDatesList
                    };
                });
            }, [schedule, year, month, employees]);

            const exportToExcel = () => {
                const days = getDaysInMonth(year, month);
                const rows = days.map(d => {
                    const r = schedule[d.dateStr]?.assignments || {};
                    const rowData = {
                        'Tanggal': d.dateStr,
                        'Hari': d.dayName
                    };
                    employees.forEach(emp => {
                        rowData[`${emp.name} (${emp.role})`] = r[emp.name] || '-';
                    });
                    rowData['Status Klinik'] = schedule[d.dateStr]?.status === 'CLOSED' ? 'KLINIK TUTUP' : 'BUKA';
                    rowData['Catatan'] = schedule[d.dateStr]?.note || '';
                    return rowData;
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `Jadwal_${MONTH_NAMES[month-1]}_${year}`);
                XLSX.writeFile(wb, `Jadwal_AYOMI_Beaute_${month}_${year}.xlsx`);
                logAction("Ekspor Excel", `Mengunduh file Excel jadwal bulan ${MONTH_NAMES[month-1]} ${year}`);
            };

            const downloadTemplateExcel = () => {
                const days = getDaysInMonth(year, month);
                const rows = days.map(d => {
                    const r = schedule[d.dateStr]?.assignments || {};
                    const rowData = {
                        'Tanggal': d.dateStr,
                        'Hari': d.dayName
                    };
                    employees.forEach(emp => {
                        rowData[`${emp.name} (${emp.role})`] = r[emp.name] || (emp.role === 'Admin' ? 'Pagi' : 'Siang');
                    });
                    rowData['Status Klinik'] = schedule[d.dateStr]?.status === 'CLOSED' ? 'KLINIK TUTUP' : 'BUKA';
                    rowData['Catatan'] = schedule[d.dateStr]?.note || '';
                    return rowData;
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `Template_${MONTH_NAMES[month-1]}_${year}`);
                XLSX.writeFile(wb, `Template_Jadwal_AYOMI_${month}_${year}.xlsx`);
                logAction("Download Template", `Mengunduh template Excel jadwal bulan ${MONTH_NAMES[month-1]} ${year}`);
                triggerToast("Template Excel berhasil diunduh!", "success");
            };

            const handleFileUpload = (e) => {
                if (!checkManagerAccess("Upload Excel")) return;
                if (isPublished) {
                    triggerToast("🚫 JADWAL TERKUNCI! Silakan tarik jadwal terlebih dahulu sebelum mengunggah file Excel.", "error");
                    if (fileInputRef.current) fileInputRef.current.value = "";
                    return;
                }

                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                        if (!jsonRows || jsonRows.length === 0) {
                            triggerToast("File Excel kosong atau format tidak sesuai.", "error");
                            return;
                        }

                        const updatedSchedule = { ...schedule };
                        let updatedCount = 0;

                        jsonRows.forEach(row => {
                            const dateVal = row['Tanggal'] || row['tanggal'] || row['DATE'] || row['Date'];
                            if (!dateVal) return;

                            let dateStr = String(dateVal).trim();

                            if (updatedSchedule[dateStr]) {
                                const statusKlinik = String(row['Status Klinik'] || row['status'] || '').toUpperCase();
                                const isClosed = statusKlinik.includes('TUTUP') || statusKlinik.includes('CLOSED');

                                const newAssignments = { ...(updatedSchedule[dateStr]?.assignments || {}) };

                                employees.forEach(emp => {
                                    const matchedKey = Object.keys(row).find(k => k.toLowerCase().includes(emp.name.toLowerCase()));
                                    if (matchedKey) {
                                        let val = String(row[matchedKey]).trim();
                                        if (val.toLowerCase().includes('pagi')) val = 'Pagi';
                                        else if (val.toLowerCase().includes('siang')) val = 'Siang';
                                        else if (val.toLowerCase().includes('full')) val = 'Full Shift';
                                        else if (val.toLowerCase().includes('ob')) val = 'OB';
                                        else if (val.toLowerCase().includes('libur') || val.toLowerCase().includes('off')) val = 'Libur';
                                        else if (val.toLowerCase().includes('tutup')) val = 'KLINIK TUTUP';

                                        newAssignments[emp.name] = val;
                                    }
                                });

                                updatedSchedule[dateStr] = {
                                    dateStr,
                                    dayName: updatedSchedule[dateStr]?.dayName || '',
                                    status: isClosed ? 'CLOSED' : 'OPEN',
                                    note: row['Catatan'] || row['catatan'] || updatedSchedule[dateStr]?.note || '',
                                    assignments: newAssignments
                                };
                                updatedCount++;
                            }
                        });

                        updateActiveSchedule(updatedSchedule, false, lastPublishedAt);
                        logAction("Upload Excel", `Mengimpor ${updatedCount} baris jadwal dari file Excel (${file.name})`);
                        triggerToast(`Berhasil mengimpor ${updatedCount} tanggal jadwal dari Excel!`, "success");
                    } catch (err) {
                        console.error(err);
                        triggerToast("Gagal membaca file Excel. Pastikan format file .xlsx / .xls valid.", "error");
                    } finally {
                        if (fileInputRef.current) fileInputRef.current.value = "";
                    }
                };
                reader.readAsBinaryString(file);
            };

            // MANDATORY INITIAL LOGIN SCREEN
            if (!currentUser) {
                return (
                    <div class="min-h-screen bg-gradient-to-br from-mulberry-950 via-mulberry-900 to-mulberry-950 flex items-center justify-center p-4">
                        <div class="bg-cream-50/95 backdrop-blur-xl rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 border border-champagne-300/60">
                            
                            <div class="text-center space-y-3">
                                <ClinicLogo size="lg" showText={true} />
                                <div class="text-xs text-mulberry-800 font-semibold pt-1 tracking-wide">
                                    Employee Scheduling & Announcement System
                                </div>
                            </div>

                            {authError && (
                                <div class="bg-blush-100 border border-rosegold-300 text-mulberry-800 text-xs font-semibold p-3.5 rounded-2xl flex items-center space-x-2">
                                    <span>⚠️</span>
                                    <span>{authError}</span>
                                </div>
                            )}

                            <form onSubmit={handleLoginSubmit} class="space-y-4">
                                <div>
                                    <label class="text-xs font-bold text-mulberry-950 uppercase tracking-wider block mb-1">
                                        Username Pengguna
                                    </label>
                                    <input 
                                        type="text" 
                                        required
                                        placeholder="Masukkan username..."
                                        value={loginForm.username}
                                        onChange={(e) => setLoginForm(prev => ({ ...prev, username: e.target.value }))}
                                        class="w-full border border-rosegold-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-champagne-500 focus:ring-2 focus:ring-champagne-200 font-medium bg-white text-mulberry-950"
                                    />
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-mulberry-950 uppercase tracking-wider block mb-1">
                                        Kata Sandi / Password
                                    </label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="Masukkan kata sandi..."
                                        value={loginForm.pass}
                                        onChange={(e) => setLoginForm(prev => ({ ...prev, pass: e.target.value }))}
                                        class="w-full border border-rosegold-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-champagne-500 focus:ring-2 focus:ring-champagne-200 font-medium bg-white text-mulberry-950"
                                    />
                                </div>

                                    </form>

                                    <div class="overflow-x-auto border border-rosegold-200 rounded-2xl shadow-sm">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-gradient-to-r from-mulberry-950 via-mulberry-900 to-mulberry-950 text-champagne-200 font-bold uppercase tracking-wider">
                                                    <th class="p-3.5">ID</th>
                                                    <th class="p-3.5">Nama Pegawai</th>
                                                    <th class="p-3.5">Jabatan</th>
                                                    <th class="p-3.5">Username Login</th>
                                                    <th class="p-3.5">Password Initial</th>
                                                    <th class="p-3.5 text-center">Aksi / Hapus</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-rosegold-100 font-medium">
                                                {employees.map(emp => (
                                                    <tr key={emp.id} class="hover:bg-blush-50/60">
                                                        <td class="p-3.5 font-mono text-slate-400 text-[11px]">{emp.id}</td>
                                                        <td class="p-3.5 font-bold text-mulberry-950 text-sm">{emp.name}</td>
                                                        <td class="p-3.5">
                                                            <span class={`px-3 py-1 rounded-full font-black text-[10px] ${
                                                                emp.role === 'Admin' ? 'bg-purple-100 text-purple-900 border border-purple-200' :
                                                                emp.role === 'Terapis' ? 'bg-blush-100 text-mulberry-900 border border-rosegold-300' :
                                                                emp.role === 'OB' ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-champagne-100 text-mulberry-900 border border-champagne-300'
                                                            }`}>
                                                                {emp.role}
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5 font-mono text-slate-600">{emp.name.toLowerCase()}</td>
                                                        <td class="p-3.5 font-mono text-slate-400">admin123</td>
                                                        <td class="p-3.5 text-center">
                                                            <button 
                                                                onClick={() => setDeletingEmpId(emp.id)}
                                                                class="bg-blush-50 hover:bg-blush-100 border border-rosegold-300 text-mulberry-800 font-bold px-3 py-1 rounded-xl text-xs transition"
                                                            >
                                                                🗑️ Hapus
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 5: RECAP & WORKING HOURS                             */}
                        {/* ========================================================= */}
                        {activeTab === 'recap' && (
                            <div class="space-y-6">
                                <div class="bg-white p-6 rounded-3xl border border-rosegold-200 shadow-md">
                                    <h3 class="font-extrabold text-mulberry-950 text-lg mb-2">
                                        📊 Rekapitulasi Jam Kerja & Jatah Libur ({MONTH_NAMES[month-1]} {year})
                                    </h3>
                                    <p class="text-xs text-slate-500 mb-4">
                                        Keterangan: Jam Efektif dihitung dari Total Jam Terjadwal dikurangi Durasi Istirahat Resmi (1 Jam per shift 8h, 2 Jam per Full Shift).
                                    </p>

                                    <div class="overflow-x-auto rounded-2xl border border-rosegold-200 shadow-sm">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-gradient-to-r from-mulberry-950 via-mulberry-900 to-mulberry-950 text-champagne-200 font-bold uppercase tracking-wider">
                                                    <th class="p-3.5">Nama Pegawai</th>
                                                    <th class="p-3.5">Jabatan</th>
                                                    <th class="p-3.5">Hari Kerja</th>
                                                    <th class="p-3.5">Hari Libur</th>
                                                    <th class="p-3.5">Shift Pagi</th>
                                                    <th class="p-3.5">Shift Siang</th>
                                                    <th class="p-3.5">Full Shift</th>
                                                    <th class="p-3.5">Jam Terjadwal</th>
                                                    <th class="p-3.5">Jam Istirahat</th>
                                                    <th class="p-3.5">Jam Efektif</th>
                                                    <th class="p-3.5">Tanggal Libur Pegawai</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-rosegold-100 font-medium">
                                                {recapData.map(r => (
                                                    <tr key={r.name} class={`hover:bg-blush-50/60 ${currentUser.role === 'employee' && currentUser.name === r.name ? 'bg-blush-100/70 font-bold' : ''}`}>
                                                        <td class="p-3.5 font-bold text-mulberry-950">{r.name}</td>
                                                        <td class="p-3.5">
                                                            <span class="bg-cream-100 text-mulberry-900 px-2.5 py-1 rounded-lg font-bold text-[11px] border border-champagne-300">
                                                                {r.role}
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5 font-semibold text-emerald-800">{r.totalWorkDays} Hari</td>
                                                        <td class="p-3.5">
                                                            <span class={`font-bold px-2.5 py-1 rounded-lg ${r.totalOffDays === 2 ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-blush-100 text-mulberry-900 border border-rosegold-300'}`}>
                                                                {r.totalOffDays} Hari
                                                            </span>
                                                        </td>
                                                        <td class="p-3.5">{r.pagiCount}</td>
                                                        <td class="p-3.5">{r.siangCount}</td>
                                                        <td class="p-3.5">{r.fullShiftCount}</td>
                                                        <td class="p-3.5 font-bold text-mulberry-950">{r.totalHours} Jam</td>
                                                        <td class="p-3.5 text-slate-500">{r.breakHours} Jam</td>
                                                        <td class="p-3.5 font-black text-mulberry-700">{r.effectiveHours} Jam</td>
                                                        <td class="p-3.5 text-[11px] text-slate-600">
                                                            {r.offDatesList.join(' | ') || '-'}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 6: CALENDAR & HOLIDAYS (MANAGER ONLY)                */}
                        {/* ========================================================= */}
                        {activeTab === 'calendar' && currentUser.role === 'manager' && (
                            <div class="space-y-6">
                                <div class="bg-white p-6 rounded-3xl border border-rosegold-200 shadow-md">
                                    <h3 class="font-bold text-mulberry-950 text-lg mb-2">
                                        ⚙️ Pengaturan Kalender, Hari Besar & Closure Policy
                                    </h3>
                                    <p class="text-xs text-slate-500 mb-4">
                                        Manager dapat mengatur tanggal khusus, hari besar keagamaan/nasional, serta menetapkan apakah klinik TUTUP atau BUKA.
                                    </p>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div class="bg-gradient-to-r from-cream-50 to-blush-50 p-5 rounded-2xl border border-rosegold-200 space-y-3">
                                            <h4 class="font-bold text-mulberry-950 text-sm">Tambah / Edit Tanggal Khusus</h4>
                                            
                                            <div>
                                                <label class="text-xs font-semibold text-mulberry-950 block mb-1">Tanggal Khusus</label>
                                                <input 
                                                    type="date"
                                                    value={editingEvent?.dateStr || `${year}-${String(month).padStart(2,'0')}-15`}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, dateStr: e.target.value }))}
                                                    class="w-full border border-rosegold-300 rounded-xl p-2.5 text-xs bg-white font-medium text-mulberry-950"
                                                />
                                            </div>

                                            <div>
                                                <label class="text-xs font-semibold text-mulberry-950 block mb-1">Nama Hari Besar / Keterangan</label>
                                                <input 
                                                    type="text"
                                                    placeholder="Contoh: Maintenance Alat / Hari Besar Islam"
                                                    value={editingEvent?.title || ''}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, title: e.target.value }))}
                                                    class="w-full border border-rosegold-300 rounded-xl p-2.5 text-xs bg-white font-medium text-mulberry-950"
                                                />
                                            </div>

                                            <div>
                                                <label class="text-xs font-semibold text-mulberry-950 block mb-1">Kategori Hari Besar</label>
                                                <select 
                                                    value={editingEvent?.type || 'Hari Libur Nasional'}
                                                    onChange={(e) => setEditingEvent(prev => ({ ...prev, type: e.target.value }))}
                                                    class="w-full border border-rosegold-300 rounded-xl p-2.5 text-xs bg-white font-bold text-mulberry-950"
                                                >
                                                    <option value="Hari Besar Keagamaan Islam">Hari Besar Keagamaan Islam</option>
                                                    <option value="Hari Besar Keagamaan Kristen">Hari Besar Keagamaan Kristen</option>
                                                    <option value="Hari Libur Nasional">Hari Libur Nasional</option>
                                                    <option value="Hari Operasional Khusus">Hari Operasional Khusus</option>
                                                    <option value="Hari Klinik Tutup">Hari Klinik Tutup</option>
                                                </select>
                                            </div>

                                            <div class="flex items-center space-x-3 py-2">
                                                <label class="text-xs font-semibold text-mulberry-950">Status Operasional Klinik:</label>
                                                <button
                                                    type="button"
                                                    onClick={() => setEditingEvent(prev => ({ ...prev, isOpen: !prev?.isOpen }))}
                                                    class={`px-3.5 py-1.5 rounded-xl text-xs font-bold shadow ${
                                                        editingEvent?.isOpen !== false ? 'bg-emerald-600 text-white' : 'bg-mulberry-800 text-white'
                                                    }`}
                                                >
                                                    {editingEvent?.isOpen !== false ? 'KLINIK BUKA' : 'KLINIK TUTUP'}
                                                </button>
                                            </div>

                                            <button 
                                                onClick={() => {
                                                    if (!editingEvent?.dateStr || !editingEvent?.title) {
                                                        triggerToast("Lengkapi tanggal dan nama hari besar.", "error");
                                                        return;
                                                    }
                                                    setCalendarEvents(prev => {
                                                        const updated = {
                                                            ...prev,
                                                            [editingEvent.dateStr]: {
                                                                title: editingEvent.title,
                                                                type: editingEvent.type,
                                                                isOpen: editingEvent.isOpen !== false,
                                                                closurePolicy: editingEvent.closurePolicy || 'COUNT_AS_OFF',
                                                                note: editingEvent.title
                                                            }
                                                        };
                                                        broadcastSync('UPDATE_CALENDAR', updated);
                                                        return updated;
                                                    });
                                                    logAction("Update Kalender", `Mengatur tanggal ${editingEvent.dateStr} sebagai ${editingEvent.title}`);
                                                    triggerToast("Kalender hari besar berhasil diperbarui!", "success");
                                                    setEditingEvent(null);
                                                }}
                                                class="w-full bg-gradient-to-r from-rosegold-500 to-mulberry-700 hover:from-rosegold-600 hover:to-mulberry-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md border border-champagne-300/30"
                                            >
                                                Simpan Tanggal Khusus
                                            </button>
                                        </div>

                                        <div class="space-y-3">
                                            <h4 class="font-bold text-mulberry-950 text-sm">Daftar Tanggal Khusus Terdaftar</h4>
                                            
                                            <div class="space-y-2">
                                                {Object.keys(calendarEvents).map(dateKey => {
                                                    const ev = calendarEvents[dateKey];
                                                    return (
                                                        <div key={dateKey} class="p-3.5 bg-white border border-rosegold-200 rounded-2xl flex items-center justify-between shadow-sm">
                                                            <div>
                                                                <div class="font-bold text-sm text-mulberry-950">{dateKey} — {ev.title}</div>
                                                                <div class="text-xs text-slate-500">{ev.type}</div>
                                                            </div>
                                                            <div class="flex items-center space-x-2">
                                                                <span class={`text-[10px] px-2.5 py-1 rounded-lg font-bold ${ev.isOpen ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-blush-100 text-mulberry-900 border border-rosegold-300'}`}>
                                                                    {ev.isOpen ? 'BUKA' : 'TUTUP'}
                                                                </span>
                                                                <button 
                                                                    onClick={() => {
                                                                        const copy = { ...calendarEvents };
                                                                        delete copy[dateKey];
                                                                        setCalendarEvents(copy);
                                                                        broadcastSync('UPDATE_CALENDAR', copy);
                                                                        logAction("Hapus Tanggal", `Hapus tanggal khusus ${dateKey}`);
                                                                    }}
                                                                    class="text-xs text-mulberry-700 hover:text-mulberry-900 font-bold px-2 py-1"
                                                                >
                                                                    Hapus
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 7: AUDIT TRAIL LOGS (MANAGER ONLY)                   */}
                        {/* ========================================================= */}
                        {activeTab === 'audit' && currentUser.role === 'manager' && (
                            <div class="bg-white p-6 rounded-3xl border border-rosegold-200 shadow-md space-y-4">
                                <h3 class="font-extrabold text-mulberry-950 text-lg mb-2">
                                    📜 Riwayat Perubahan & Audit Trail System
                                </h3>
                                <p class="text-xs text-slate-500 mb-4">
                                    Mencatat seluruh aksi pengubahan jadwal, pengumuman, kalender, dan publikasi oleh pengguna.
                                </p>

                                <div class="overflow-x-auto rounded-2xl border border-rosegold-200 shadow-sm">
                                    <table class="w-full text-left text-xs border-collapse">
                                        <thead>
                                            <tr class="bg-gradient-to-r from-mulberry-950 via-mulberry-900 to-mulberry-950 text-champagne-200 font-bold uppercase tracking-wider">
                                                <th class="p-3.5">Waktu (Timestamp)</th>
                                                <th class="p-3.5">Pengguna</th>
                                                <th class="p-3.5">Jenis Aksi</th>
                                                <th class="p-3.5">Detail Perubahan</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-rosegold-100">
                                            {auditLogs.map((log, index) => (
                                                <tr key={index} class="hover:bg-blush-50/60">
                                                    <td class="p-3.5 font-mono text-slate-600">{log.timestamp}</td>
                                                    <td class="p-3.5 font-semibold text-mulberry-950">{log.user}</td>
                                                    <td class="p-3.5">
                                                        <span class="bg-champagne-100 text-mulberry-900 border border-champagne-300 font-bold px-2.5 py-1 rounded-lg text-[10px]">
                                                            {log.action}
                                                        </span>
                                                    </td>
                                                    <td class="p-3.5 text-slate-700">{log.details}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* EDIT SINGLE DATE ROW MODAL FOR MANAGER */}
                    {editingDateRow && (
                        <div class="fixed inset-0 bg-mulberry-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-cream-50 rounded-3xl shadow-2xl max-w-lg w-full p-6 space-y-4 border border-rosegold-300 max-h-[90vh] overflow-y-auto">
                                <div class="flex items-center justify-between border-b border-rosegold-200 pb-3">
                                    <h3 class="font-bold text-mulberry-950 text-base flex items-center space-x-2">
                                        <span>✏️ Edit Jadwal Tanggal: {editingDateRow}</span>
                                    </h3>
                                    <button onClick={() => setEditingDateRow(null)} class="text-slate-400 hover:text-mulberry-900 text-lg font-bold">✕</button>
                                </div>

                                <div class="space-y-3">
                                    <div class="flex items-center justify-between bg-blush-100/70 p-3 rounded-2xl border border-rosegold-200">
                                        <span class="text-xs font-bold text-mulberry-950">Status Operasional Tanggal Ini:</span>
                                        <button 
                                            type="button"
                                            onClick={() => {
                                                const isCurrentlyClosed = schedule[editingDateRow]?.status === 'CLOSED';
                                                const newStatus = isCurrentlyClosed ? 'OPEN' : 'CLOSED';
                                                const newAssignments = { ...(schedule[editingDateRow]?.assignments || {}) };
                                                if (newStatus === 'CLOSED') {
                                                    employees.forEach(e => newAssignments[e.name] = 'KLINIK TUTUP');
                                                }
                                                const updatedSchedule = {
                                                    ...schedule,
                                                    [editingDateRow]: {
                                                        ...schedule[editingDateRow],
                                                        status: newStatus,
                                                        assignments: newAssignments
                                                    }
                                                };
                                                updateActiveSchedule(updatedSchedule, false, lastPublishedAt);
                                            }}
                                            class={`px-3 py-1 rounded-xl text-xs font-bold shadow ${
                                                schedule[editingDateRow]?.status === 'CLOSED' ? 'bg-mulberry-800 text-champagne-200' : 'bg-emerald-600 text-white'
                                            }`}
                                        >
                                            {schedule[editingDateRow]?.status === 'CLOSED' ? 'KLINIK TUTUP' : 'KLINIK BUKA'}
                                        </button>
                                    </div>

                                    <div class="divide-y divide-rosegold-100">
                                        {employees.map(emp => (
                                            <div key={emp.id} class="py-2.5 flex items-center justify-between text-xs">
                                                <div>
                                                    <span class="font-bold text-mulberry-950">{emp.name}</span>
                                                    <span class="text-[10px] text-mulberry-700 bg-blush-100 px-2 py-0.5 rounded-md ml-2 font-semibold">{emp.role}</span>
                                                </div>
                                                <select 
                                                    value={schedule[editingDateRow]?.assignments[emp.name] || 'Pagi'}
                                                    onChange={(e) => handleCellEdit(editingDateRow, emp.name, e.target.value)}
                                                    disabled={isPublished}
                                                    class="border border-rosegold-300 rounded-xl px-2.5 py-1 text-xs bg-white font-bold text-mulberry-950 focus:ring-2 focus:ring-rosegold-400"
                                                >
                                                    <option value="Pagi">Pagi (08:00–16:00)</option>
                                                    <option value="Siang">Siang (13:00–21:00)</option>
                                                    <option value="Full Shift">Full Shift (08:00–08:00)</option>
                                                    <option value="OB">OB Shift (07:30–15:30)</option>
                                                    <option value="Libur">Libur (Off)</option>
                                                    <option value="KLINIK TUTUP">Klinik Tutup</option>
                                                </select>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div class="pt-3 border-t border-rosegold-200 flex justify-end">
                                    <button 
                                        onClick={() => setEditingDateRow(null)}
                                        class="bg-gradient-to-r from-rosegold-500 to-mulberry-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow border border-champagne-300/30"
                                    >
                                        Selesai & Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRMATION DELETE EMPLOYEE MODAL */}
                    {deletingEmpId && (
                        <div class="fixed inset-0 bg-mulberry-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-cream-50 rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 text-center border border-rosegold-300">
                                <div class="text-3xl">⚠️</div>
                                <h3 class="text-base font-extrabold text-mulberry-950">
                                    Hapus Pegawai Ini?
                                </h3>
                                <p class="text-xs text-mulberry-800 font-medium">
                                    Apakah Anda yakin ingin menghapus <strong>{employees.find(e => e.id === deletingEmpId)?.name}</strong>? Tindakan ini akan menghapus akun login pegawai dan memperbarui daftar roster.
                                </p>
                                <div class="flex items-center justify-center space-x-3 pt-2">
                                    <button 
                                        onClick={() => setDeletingEmpId(null)}
                                        class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-xl text-xs transition"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => handleDeleteEmployee(deletingEmpId)}
                                        class="bg-gradient-to-r from-mulberry-700 to-mulberry-900 hover:from-mulberry-800 hover:to-mulberry-950 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow border border-champagne-300/30"
                                    >
                                        Ya, Hapus Pegawai
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
